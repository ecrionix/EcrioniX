<style>
:root{--bg:#020617;--bg2:#080d1a;--bg3:#0c1526;--bdr:rgba(148,163,184,.1);--blue:#38bdf8;--teal:#2dd4bf;--text:#e2e8f0;--sl:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;line-height:1.7}
a{color:var(--teal);text-decoration:none}
#authLoading{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
.auth-spinner{width:36px;height:36px;border:3px solid rgba(56,189,248,.15);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.navbar{background:var(--nav-bg,rgba(2,6,23,.97));border-bottom:1px solid var(--bdr);padding:1rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:.65rem}
.navbar-logo{font-size:1.15rem;font-weight:700;color:var(--nav-text,#fff)}
.navbar-right{display:flex;align-items:center;gap:.65rem}
.back-link{color:var(--sl);font-size:.9rem}
.back-link:hover{color:var(--blue)}
footer{border-top:1px solid var(--bdr);padding:2rem;text-align:center;font-size:.8rem;color:var(--sl);background:var(--bg2);margin-top:2rem}
.scoring{font-size:.85rem;color:var(--sl);margin:.8rem 0 1.2rem}
.scoring b{color:var(--heading,#f8fafc)}

<body>
<div id="authLoading"><div class="auth-spinner"></div></div>
<div class="navbar">
  <div class="navbar-logo">EcrioniX Problems</div>
  <div class="navbar-right">
    <div id="themeToggleSlot"></div>
    <a href="/problems/" class="back-link">← Problems</a>
    <a href="/premium-course/" class="back-link">Premium</a>
  </div>
</div>

<div id="pageContent" style="display:none">
  <div class="problems-hero">
    <h1>Leaderboard</h1>
    <p>First successful solve only. Easy 10 · Medium 25 · Hard 50.</p>
  </div>
  <div class="problems-wrap" style="max-width:640px">
    <p class="scoring" id="youBanner"></p>
    <div class="board-card" id="fullBoard"><div class="empty-state">Loading…</div></div>
  </div>
</div>

<footer>© 2026 EcrioniX · <a href="/problems/">Problems</a> · <a href="/">Home</a></footer>

<script>
let currentUser = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

firebase.auth().onAuthStateChanged(user => {
  if (!user) { window.location.href = '/premium-course/'; return; }
  currentUser = user;
  document.getElementById('authLoading').style.display = 'none';
  document.getElementById('pageContent').style.display = 'block';
  listenBoard();
});

function listenBoard() {
  const el = document.getElementById('fullBoard');
  firebase.firestore().collection('leaderboard').orderBy('points', 'desc').limit(100)
    .onSnapshot(snap => {
      if (snap.empty) {
        el.innerHTML = '<div class="empty-state">No solves yet. <a href="/problems/">Be first →</a></div>';
        document.getElementById('youBanner').textContent = '';
        return;
      }
      let myRank = null, myPts = null, mySolved = null;
      el.innerHTML = snap.docs.map((doc, i) => {
        const r = doc.data();
        const you = currentUser && r.uid === currentUser.uid;
        if (you) { myRank = i + 1; myPts = r.points || 0; mySolved = r.solvedCount || 0; }
        const initial = (r.name || 'M').charAt(0).toUpperCase();
        const av = r.photoURL ? `<img src="${esc(r.photoURL)}" alt="">` : initial;
        return `<div class="board-row ${you ? 'you' : ''}">
          <div class="board-rank">${i + 1}</div>
          <div class="board-avatar">${av}</div>
          <div class="board-name">${esc(r.name || 'Member')}${you ? ' (you)' : ''}</div>
          <div class="board-stats"><b>${r.points || 0}</b> pts<br>${r.solvedCount || 0} solved</div>
        </div>`;
      }).join('');
      document.getElementById('youBanner').innerHTML = myRank
        ? `You are <b>#${myRank}</b> with <b>${myPts}</b> points across <b>${mySolved}</b> problems.`
        : `You are not on the board yet - <a href="/problems/">solve a kata</a> to appear.`;
    }, () => {
      el.innerHTML = '<div class="empty-state">Could not load leaderboard.</div>';
    });
}
</script>
<script defer src="/assets/theme-toggle.js"></script>
</body>
