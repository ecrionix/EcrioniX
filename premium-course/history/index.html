<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchase History — EcrioniX Premium</title>
<link rel="icon" href="/favicon1.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCP8IvAhIpjVTSTgfAu7xTbTryWjwlI_h4",
  authDomain: "ecrionix.firebaseapp.com",
  projectId: "ecrionix",
  storageBucket: "ecrionix.firebasestorage.app",
  messagingSenderId: "859295895664",
  appId: "1:859295895664:web:893f744ee8ad871f9464b5"
};
firebase.initializeApp(firebaseConfig);
firebase.auth().onAuthStateChanged(user => {
  document.getElementById('authLoading').style.display = 'none';
  if (user) {
    loadFullHistory(user);
  } else {
    window.location.href = '/premium-course/';
  }
});
</script>
<style>
:root{--bg:#020617;--bg2:#080d1a;--bg3:#0c1526;--bdr:rgba(148,163,184,.1);--blue:#38bdf8;--teal:#2dd4bf;--text:#e2e8f0;--sl:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit','Noto Sans',sans-serif;line-height:1.7}
a{color:var(--teal);text-decoration:none}a:hover{text-decoration:underline}
#authLoading{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center}
.auth-spinner{width:36px;height:36px;border:3px solid rgba(56,189,248,.15);border-top-color:var(--blue);border-radius:50%;animation:authspin .7s linear infinite}
@keyframes authspin{to{transform:rotate(360deg)}}
.navbar{background:rgba(2,6,23,.97);border-bottom:1px solid var(--bdr);padding:1rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.navbar-logo{font-size:1.2rem;font-weight:700;color:#fff}
.back-link{color:var(--sl);font-size:0.9rem;display:flex;align-items:center;gap:0.4rem}
.back-link:hover{color:var(--blue);text-decoration:none}
.container{max-width:800px;margin:0 auto;padding:2rem 1rem}
h1{font-size:1.8rem;margin-bottom:0.4rem;color:#f8fafc}
.subtitle{color:var(--sl);margin-bottom:2rem}
.filter-bar{display:flex;gap:0.6rem;margin-bottom:1.5rem;flex-wrap:wrap}
.filter-btn{padding:0.5rem 1rem;border-radius:20px;border:1px solid var(--bdr);background:var(--bg2);color:var(--sl);font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.filter-btn:hover{border-color:var(--blue);color:var(--text)}
.filter-btn.active{background:var(--blue);color:#020617;border-color:var(--blue)}
.history-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.history-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:0.8rem}
.history-course{font-size:1.05rem;font-weight:700;color:#f8fafc}
.history-date{color:var(--sl);font-size:0.8rem;margin-top:0.2rem}
.status-badge{font-size:0.72rem;font-weight:700;padding:0.3rem 0.8rem;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.status-pending{background:rgba(251,191,36,.15);color:#fbbf24}
.status-approved{background:rgba(74,222,128,.15);color:#4ade80}
.status-rejected{background:rgba(248,113,113,.15);color:#f87171}
.status-revoked{background:rgba(148,163,184,.15);color:#94a3b8}
.history-detail{font-size:0.85rem;color:var(--sl);margin-top:0.3rem}
.history-detail b{color:#e2e8f0}
.history-reason{font-size:0.85rem;margin-top:0.6rem;padding:0.7rem 1rem;border-radius:8px}
.history-reason.rejected{background:rgba(248,113,113,.08);color:#f87171}
.history-reason.revoked{background:rgba(148,163,184,.08);color:#94a3b8}
.empty-state{text-align:center;padding:4rem 1rem;color:var(--sl)}
footer{border-top:1px solid var(--bdr);padding:2rem;text-align:center;font-size:0.8rem;color:var(--sl);background:var(--bg2);margin-top:3rem}
</style>
</head>
<body>

<div id="authLoading"><div class="auth-spinner"></div></div>

<div class="navbar">
  <div class="navbar-logo">🎓 EcrioniX Premium</div>
  <a href="/premium-course/" class="back-link">← Back to Premium</a>
</div>

<div class="container">
  <h1>Purchase History</h1>
  <p class="subtitle">Every course request you've submitted, with its full status.</p>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-status="all" onclick="filterHistory('all')">All</button>
    <button class="filter-btn" data-status="pending" onclick="filterHistory('pending')">Pending</button>
    <button class="filter-btn" data-status="approved" onclick="filterHistory('approved')">Approved</button>
    <button class="filter-btn" data-status="rejected" onclick="filterHistory('rejected')">Rejected</button>
    <button class="filter-btn" data-status="revoked" onclick="filterHistory('revoked')">Revoked</button>
  </div>

  <div id="historyList"></div>
</div>

<footer>
  © 2026 EcrioniX · <a href="/">Home</a> · <a href="/about/">About</a> · <a href="/contact/">Contact</a>
</footer>

<script>
const COURSE_NAMES = {
  'cdc': 'Clock Domain Crossing (CDC)',
  'low-power': 'Low Power Verification',
  'riscv': 'RISC-V Deep Dive',
};

const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let allRequests = [];

async function loadFullHistory(user) {
  try {
    const snapshot = await firebase.firestore().collection('paymentRequests')
      .where('userId', '==', user.uid)
      .get();

    allRequests = [];
    snapshot.forEach(doc => allRequests.push(doc.data()));
    allRequests.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));

    renderHistory(allRequests);
  } catch (error) {
    console.error("Error loading history:", error);
    document.getElementById('historyList').innerHTML = '<div class="empty-state">Unable to load purchase history. Please try again later.</div>';
  }
}

function renderHistory(requests) {
  const list = document.getElementById('historyList');

  if (requests.length === 0) {
    list.innerHTML = '<div class="empty-state">No purchase history yet.<br><a href="/premium-course/">Browse courses →</a></div>';
    return;
  }

  list.innerHTML = requests.map(req => {
    const courseName = COURSE_NAMES[req.courseId] || req.courseId;
    const submittedDate = req.createdAt?.toDate?.()?.toLocaleString() || 'N/A';
    const statusDates = {
      approved: req.approvedAt?.toDate?.()?.toLocaleString(),
      rejected: req.rejectedAt?.toDate?.()?.toLocaleString(),
      revoked: req.revokedAt?.toDate?.()?.toLocaleString(),
    };
    const statusDate = statusDates[req.status];

    let reasonHtml = '';
    if (req.status === 'rejected' && req.rejectionReason) {
      reasonHtml = `<div class="history-reason rejected">Reason: ${escapeHtml(req.rejectionReason)}</div>`;
    } else if (req.status === 'revoked') {
      reasonHtml = `<div class="history-reason revoked">Access to this course was later revoked by an admin.</div>`;
    }

    return `
      <div class="history-card" data-status="${escapeHtml(req.status)}">
        <div class="history-card-top">
          <div>
            <div class="history-course">${escapeHtml(courseName)}</div>
            <div class="history-date">Submitted: ${submittedDate}</div>
            ${statusDate ? `<div class="history-date">${escapeHtml(req.status)} on: ${statusDate}</div>` : ''}
          </div>
          <span class="status-badge status-${escapeHtml(req.status)}">${escapeHtml(req.status)}</span>
        </div>
        <div class="history-detail"><b>Payment Method:</b> ${escapeHtml(req.paymentMethod)}</div>
        <div class="history-detail"><b>Payment ID:</b> ${escapeHtml(req.paymentId)}</div>
        ${reasonHtml}
      </div>
    `;
  }).join('');
}

function filterHistory(status) {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.status === status);
  });
  const filtered = status === 'all' ? allRequests : allRequests.filter(r => r.status === status);
  renderHistory(filtered);
}
</script>

</body>
</html>
