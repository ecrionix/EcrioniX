<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Async FIFO Lab | EcrioniX Premium</title>
<link rel="icon" href="/favicon1.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCP8IvAhIpjVTSTgfAu7xTbTryWjwlI_h4",
  authDomain: "ecrionix.firebaseapp.com",
  projectId: "ecrionix",
  storageBucket: "ecrionix.firebasestorage.app",
  messagingSenderId: "859295895664",
  appId: "1:859295895664:web:893f744ee8ad871f9464b5"
};
firebase.initializeApp(firebaseConfig);
firebase.auth().onAuthStateChanged(user => {
  if (!user) { window.location.href = '/premium-course/'; return; }
  checkAccess(user);
});
async function checkAccess(user) {
  try {
    const doc = await firebase.firestore().collection('users').doc(user.uid).get();
    const data = doc.data();
    const wasApproved = data?.approvedCourses?.includes('cdc');
    const expiry = data?.courseExpiry?.cdc;
    const isExpired = wasApproved && expiry && expiry.toDate() < new Date();
    const hasAccess = wasApproved && !isExpired;

    document.getElementById('authLoading').style.display = 'none';

    if (hasAccess) {
      document.getElementById('courseContent').style.display = 'block';
    } else {
      document.getElementById('noAccess').style.display = 'block';
    }
  } catch (error) {
    document.getElementById('authLoading').style.display = 'none';
    document.getElementById('noAccess').style.display = 'block';
  }
}
</script>
<style>
:root{--bg:#020617;--bg2:#080d1a;--bg3:#0c1526;--bdr:rgba(148,163,184,.1);--blue:#38bdf8;--text:#e2e8f0;--sl:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;line-height:1.7}
a{color:var(--blue);text-decoration:none}
#authLoading{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
.auth-spinner{width:36px;height:36px;border:3px solid rgba(56,189,248,.15);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.navbar{background:rgba(2,6,23,.97);border-bottom:1px solid var(--bdr);padding:1rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.navbar-logo{font-size:1.2rem;font-weight:700;color:#fff}
.back-link{color:var(--sl);font-size:0.9rem}
.back-link:hover{color:var(--blue)}
.container{max-width:850px;margin:0 auto;padding:2rem 1rem}
.no-access{text-align:center;padding:5rem 1.5rem}
.no-access h1{color:#f87171}
footer{border-top:1px solid var(--bdr);padding:2rem;text-align:center;font-size:0.8rem;color:var(--sl);background:var(--bg2);margin-top:4rem}
</style>
</head>
<body>
<div id="authLoading"><div class="auth-spinner"></div></div>
<div class="navbar">
  <div class="navbar-logo">🎓 EcrioniX Premium</div>
  <a href="/premium-course/cdc/" class="back-link">← Course Index</a>
</div>
<div id="noAccess" class="no-access" style="display:none;">
  <h1 id="noAccessTitle">🔒 No Access</h1>
  <p id="noAccessMessage">You don't have approved access to this course yet.</p>
</div>

<div id="courseContent" style="display:none;">
  <div class="container">
    <div style="font-size:0.85rem;color:var(--sl);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;margin-bottom:0.4rem">Module 5</div>
    <h1 style="font-size:2.2rem;margin-bottom:2rem;color:#f8fafc">Interactive Async FIFO Lab Session</h1>
    
    <div style="background:var(--bg2);border:1px solid var(--bdr);padding:2rem;border-radius:12px;text-align:center;">
        <h2 style="color:var(--blue);margin-bottom:1rem;">Lab Under Construction</h2>
        <p>The interactive simulator and assignments for this module are currently being built. Check back soon!</p>
    </div>
  </div>
</div>

<footer>© 2026 EcrioniX</footer>
</body>
</html>
