<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="I2C testbench block diagram">
<defs><marker id="m115-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker><marker id="m115-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/></marker></defs>
<text x="360" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">i2c_master_tb — stimulus + DUT + slave BFM + checker</text>
<rect x="20" y="55" width="120" height="80" rx="10" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
<text x="80" y="85" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Stimulus</text>
<text x="80" y="102" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">reg_write()</text>
<text x="80" y="116" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">poll_stat()</text>
<rect x="170" y="45" width="200" height="100" rx="10" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="270" y="78" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">DUT: i2c_master_top</text>
<text x="270" y="96" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">CSR + byte + bit</text>
<text x="270" y="112" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">scl_oe, sda_oe</text>
<rect x="400" y="55" width="130" height="80" rx="10" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="465" y="85" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Slave BFM</text>
<text x="465" y="102" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">match addr</text>
<text x="465" y="116" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">ACK / NACK</text>
<rect x="560" y="55" width="140" height="80" rx="10" fill="rgba(251,191,36,.1)" stroke="#fbbf24"/>
<text x="630" y="85" fill="#fbbf24" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Checker</text>
<text x="630" y="102" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">slave.mem[]</text>
<text x="630" y="116" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">!== PASS/FAIL</text>
<rect x="250" y="175" width="220" height="55" rx="8" fill="#0c1526" stroke="#94a3b8"/>
<text x="360" y="200" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Open-drain bus model</text>
<text x="360" y="218" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">wire sda; pull-up + wired-AND resolution</text>
<line x1="270" y1="145" x2="270" y2="175" stroke="#94a3b8" marker-end="url(#m115-arr)"/>
<line x1="465" y1="135" x2="465" y2="175" stroke="#2dd4bf" marker-end="url(#m115-teal)"/>
<line x1="140" y1="95" x2="170" y2="95" stroke="#38bdf8" marker-end="url(#m115-arr)"/>
<line x1="370" y1="95" x2="400" y2="95" stroke="#2dd4bf" marker-end="url(#m115-teal)"/>
<line x1="530" y1="95" x2="560" y2="95" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#m115-arr)"/>
</svg>