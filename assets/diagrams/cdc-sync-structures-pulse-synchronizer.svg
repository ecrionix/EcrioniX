<svg viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pulse synchronizer">
<defs><marker id="m96-pulse" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/></marker></defs>
<text x="280" y="22" fill="#a78bfa" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Pulse sync — toggle in src, edge-detect in dst</text>
<rect x="30" y="50" width="200" height="60" rx="8" fill="#0c1526" stroke="#38bdf8"/>
<text x="130" y="72" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Source domain</text>
<text x="130" y="92" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">pulse → toggle level</text>
<rect x="280" y="50" width="60" height="30" rx="4" fill="#0c1526" stroke="#2dd4bf"/><text x="310" y="70" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="monospace">2FF</text>
<rect x="360" y="50" width="180" height="60" rx="8" fill="#0c1526" stroke="#a78bfa"/>
<text x="450" y="72" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Dest domain</text>
<text x="450" y="92" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">edge detect → 1-cycle pulse</text>
<line x1="230" y1="80" x2="280" y2="65" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m96-pulse)"/>
<line x1="340" y1="65" x2="360" y2="80" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m96-pulse)"/>
<text x="280" y="140" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Toggle stretches pulse to full level — 2FF can sample it reliably</text>
<rect x="100" y="160" width="360" height="28" rx="6" fill="rgba(248,113,113,.08)" stroke="#f87171"/>
<text x="280" y="179" fill="#f87171" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Min spacing between pulses &gt; sync latency (typically 4+ dst cycles)</text>
</svg>