<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illegal state recovery diagram">
<defs><marker id="m64-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f87171"/></marker></defs>
<text x="240" y="22" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Illegal state → forced recovery to IDLE</text>
<circle cx="120" cy="130" r="40" fill="#0c1526" stroke="#2dd4bf"/><text x="120" y="128" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">IDLE</text><text x="120" y="144" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">safe</text>
<circle cx="280" cy="80" r="36" fill="#0c1526" stroke="#38bdf8"/><text x="280" y="78" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">WORK</text>
<circle cx="360" cy="180" r="36" fill="rgba(248,113,113,.15)" stroke="#f87171" stroke-dasharray="4,3"/><text x="360" y="175" fill="#f87171" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">ILLEGAL</text><text x="360" y="192" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">3'b111</text>
<path d="M160,115 L240,95" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m64-arr)"/>
<text x="200" y="95" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">start</text>
<path d="M250,95 L140,115" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m64-arr)"/>
<text x="195" y="125" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">done</text>
<path d="M330,180 L160,145" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#m64-arr)"/>
<text x="248" y="168" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">default → IDLE</text>
</svg>