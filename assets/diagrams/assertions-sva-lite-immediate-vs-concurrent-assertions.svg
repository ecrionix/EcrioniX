<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Immediate vs concurrent assertions">
<text x="350" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Assertion types for RTL owners</text>
<rect x="40" y="50" width="280" height="130" rx="10" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/>
<text x="180" y="78" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Immediate</text>
<text x="180" y="100" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">assert (a + b &lt; 256);</text>
<text x="180" y="118" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Inside always / initial</text>
<text x="180" y="134" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Checks NOW at this line</text>
<text x="180" y="158" fill="#4ade80" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">✓ Easy · ✓ Synthesizable (simple)</text>
<rect x="380" y="50" width="280" height="130" rx="10" fill="rgba(167,139,250,.1)" stroke="#a78bfa"/>
<text x="520" y="78" fill="#a78bfa" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Concurrent</text>
<text x="520" y="100" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">assert property (@(posedge clk) a |-> ##1 b);</text>
<text x="520" y="118" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Parallel to DUT logic</text>
<text x="520" y="134" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Checks over TIME (cycles)</text>
<text x="520" y="158" fill="#fbbf24" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">⚡ Powerful · often sim-only</text>
</svg>