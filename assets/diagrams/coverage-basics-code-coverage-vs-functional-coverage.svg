<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Code coverage vs functional coverage">
<text x="350" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Two lenses on the same simulation run</text>
<rect x="40" y="50" width="280" height="150" rx="10" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/>
<text x="180" y="78" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Code coverage</text>
<text x="180" y="100" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Automatic · tool-generated</text>
<text x="60" y="122" fill="#e2e8f0" font-size="8" font-family="monospace">■ Line — did this statement run?</text>
<text x="60" y="138" fill="#e2e8f0" font-size="8" font-family="monospace">■ Branch — both if/else taken?</text>
<text x="60" y="154" fill="#e2e8f0" font-size="8" font-family="monospace">■ Toggle — 0→1 and 1→0 seen?</text>
<text x="60" y="170" fill="#e2e8f0" font-size="8" font-family="monospace">■ FSM — every state visited?</text>
<text x="180" y="192" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">"Was the RTL touched?"</text>
<rect x="380" y="50" width="280" height="150" rx="10" fill="rgba(167,139,250,.1)" stroke="#a78bfa"/>
<text x="520" y="78" fill="#a78bfa" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Functional coverage</text>
<text x="520" y="100" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Manual · you define bins</text>
<text x="400" y="122" fill="#e2e8f0" font-size="8" font-family="monospace">■ Opcode ADD, MUL, AND tested?</text>
<text x="400" y="138" fill="#e2e8f0" font-size="8" font-family="monospace">■ Reset mid-xfer occurred?</text>
<text x="400" y="154" fill="#e2e8f0" font-size="8" font-family="monospace">■ FIFO filled to DEPTH?</text>
<text x="400" y="170" fill="#e2e8f0" font-size="8" font-family="monospace">■ Backpressure &gt; 3 cycles?</text>
<text x="520" y="192" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">"Did the scenario happen?"</text>
<text x="350" y="220" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">You need both — code coverage finds blind spots; functional coverage tracks test plan completion</text>
</svg>