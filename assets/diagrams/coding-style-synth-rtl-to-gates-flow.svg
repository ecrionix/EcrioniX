<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RTL to gates flow">
          <rect x="40" y="70" width="140" height="70" rx="10" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
          <text x="110" y="110" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Your RTL</text>
          <text x="200" y="110" fill="#94a3b8" font-size="18" text-anchor="middle">→</text>
          <rect x="220" y="70" width="140" height="70" rx="10" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
          <text x="290" y="105" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Elaborate</text>
          <text x="290" y="122" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">+ lint</text>
          <text x="380" y="110" fill="#94a3b8" font-size="18" text-anchor="middle">→</text>
          <rect x="400" y="70" width="140" height="70" rx="10" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
          <text x="470" y="105" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Map to</text>
          <text x="470" y="122" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">library cells</text>
          <text x="560" y="110" fill="#94a3b8" font-size="18" text-anchor="middle">→</text>
          <rect x="580" y="70" width="100" height="70" rx="10" fill="#0c1526" stroke="#94a3b8"/>
          <text x="630" y="110" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Gates</text>
          <text x="360" y="40" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Ambiguous RTL → warnings, latches, or wrong logic</text>
          <text x="360" y="175" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Style rules exist to keep the middle boxes deterministic</text>
        </svg>