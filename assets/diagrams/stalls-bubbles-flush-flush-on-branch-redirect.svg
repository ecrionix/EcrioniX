<svg viewBox="0 0 560 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flush on branch redirect">
<text x="280" y="22" fill="#2dd4bf" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Flush vs stall — different goals</text>
<rect x="60" y="50" width="200" height="45" rx="8" fill="rgba(248,113,113,.08)" stroke="#f87171"/>
<text x="160" y="70" fill="#f87171" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Flush</text>
<text x="160" y="86" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Kill wrong-path ops · redirect PC</text>
<rect x="300" y="50" width="200" height="45" rx="8" fill="rgba(251,191,36,.08)" stroke="#fbbf24"/>
<text x="400" y="70" fill="#fbbf24" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Stall</text>
<text x="400" y="86" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Wait for data · preserve ops</text>
<line x1="160" y1="110" x2="160" y2="145" stroke="#f87171" stroke-width="1.5"/>
<text x="160" y="135" fill="#f87171" font-size="8" text-anchor="middle" font-family="monospace">branch taken</text>
<line x1="400" y1="110" x2="400" y2="145" stroke="#fbbf24" stroke-width="1.5"/>
<text x="400" y="135" fill="#fbbf24" font-size="8" text-anchor="middle" font-family="monospace">load-use</text>
<text x="280" y="160" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Never flush and stall the same stage without a priority encoder</text>
</svg>