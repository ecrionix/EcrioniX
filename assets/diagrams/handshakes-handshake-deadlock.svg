<svg viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Handshake deadlock">
<text x="240" y="22" fill="#f87171" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Deadlock — both sides waiting</text>
<rect x="40" y="45" width="110" height="55" rx="8" fill="#0c1526" stroke="#38bdf8"/><text x="105" y="68" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Source</text><text x="105" y="88" fill="#f87171" font-size="8" text-anchor="middle" font-family="monospace">valid=ready?</text>
<rect x="290" y="45" width="110" height="55" rx="8" fill="#0c1526" stroke="#2dd4bf"/><text x="355" y="68" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Sink">Sink</text><text x="355" y="88" fill="#f87171" font-size="8" text-anchor="middle" font-family="monospace">ready=valid?</text>
<path d="M150,60 C200,20 280,20 290,60" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,3"/>
<path d="M290,95 C240,125 160,125 150,95" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="240" y="125" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Neither asserts → no xfer ever → system hangs</text>
</svg>