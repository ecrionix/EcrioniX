<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open-drain I2C pad model">
<text x="350" y="22" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Open-drain pad — drive low or release (high-Z)</text>
<rect x="60" y="50" width="120" height="70" rx="8" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
<text x="120" y="78" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">I2C pad cell</text>
<text x="120" y="96" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">oe=1 → pull low</text>
<text x="120" y="110" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">oe=0 → high-Z</text>
<line x1="180" y1="85" x2="312" y2="85" stroke="#2dd4bf" stroke-width="2"/>
<circle cx="320" cy="85" r="8" fill="none" stroke="#fbbf24" stroke-width="2"/>
<text x="320" y="70" fill="#fbbf24" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Rp</text>
<line x1="328" y1="85" x2="420" y2="85" stroke="#2dd4bf" stroke-width="2"/>
<text x="360" y="78" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="monospace">SDA bus</text>
<line x1="320" y1="93" x2="320" y2="130" stroke="#fbbf24" stroke-width="1.5"/>
<text x="340" y="125" fill="#fbbf24" font-size="8" font-family="Outfit,sans-serif">VDD</text>
<rect x="420" y="60" width="90" height="50" rx="6" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="465" y="82" fill="#a78bfa" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Other slave</text>
<text x="465" y="98" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">same wire</text>
<rect x="80" y="155" width="540" height="70" rx="8" fill="#0c1526" stroke="rgba(148,163,184,.2)"/>
<text x="350" y="178" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Logic levels on the bus</text>
<text x="120" y="205" fill="#f87171" font-size="9" text-anchor="middle" font-family="monospace">LOW = any device pulls down</text>
<text x="350" y="205" fill="#4ade80" font-size="9" text-anchor="middle" font-family="monospace">HIGH = all devices release</text>
<text x="580" y="205" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="monospace">never drive HIGH</text>
</svg>