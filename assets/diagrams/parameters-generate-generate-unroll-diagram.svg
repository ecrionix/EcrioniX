<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Generate unroll diagram">
          <text x="360" y="28" fill="#38bdf8" font-size="14" text-anchor="middle" font-family="Outfit,sans-serif">generate for (i=0; i&lt;N; i++) → N hardware copies</text>
          <rect x="40" y="50" width="140" height="60" rx="8" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
          <text x="110" y="85" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Source RTL</text>
          <text x="210" y="85" fill="#94a3b8" font-size="20" text-anchor="middle">→</text>
          <rect x="240" y="50" width="440" height="60" rx="8" fill="rgba(45,212,191,.08)" stroke="#2dd4bf"/>
          <text x="460" y="75" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Elaboration (before synthesis)</text>
          <text x="460" y="95" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Unrolls into slice[0] slice[1] … slice[N-1]</text>
          <rect x="80" y="140" width="120" height="50" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="140" y="170" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="JetBrains Mono,monospace">lane[0]</text>
          <rect x="220" y="140" width="120" height="50" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="280" y="170" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="JetBrains Mono,monospace">lane[1]</text>
          <rect x="360" y="140" width="120" height="50" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="420" y="170" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="JetBrains Mono,monospace">lane[2]</text>
          <text x="520" y="170" fill="#94a3b8" font-size="18" text-anchor="middle">…</text>
          <rect x="560" y="140" width="120" height="50" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="620" y="170" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="JetBrains Mono,monospace">lane[N-1]</text>
          <text x="360" y="220" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">NOT a runtime for-loop — each iteration is real logic</text>
        </svg>