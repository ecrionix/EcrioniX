<svg viewBox="0 0 420 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sync FIFO pointer diagram">
<defs><marker id="arr122" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2dd4bf"/></marker></defs>
<text x="210" y="18" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Sync FIFO — wr_ptr, rd_ptr, count</text>
<rect x="60" y="40" width="300" height="50" rx="6" fill="#0c1526" stroke="#38bdf8"/>
<text x="210" y="70" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="JetBrains Mono,monospace">[0][1][2]...[DEPTH-1]</text>
<circle cx="100" cy="110" r="8" fill="#a78bfa"/><text x="100" y="130" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">wr_ptr</text>
<circle cx="200" cy="110" r="8" fill="#2dd4bf"/><text x="200" y="130" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">rd_ptr</text>
<text x="320" y="115" fill="#4ade80" font-size="9" font-family="Outfit,sans-serif">count = wr - rd</text>
<text x="210" y="155" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">empty: count==0 | full: count==DEPTH</text>
</svg>