<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two's complement negation steps">
          <text x="360" y="28" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">+5 → −5: invert then add 1</text>
          <g font-family="JetBrains Mono,monospace" font-size="11">
            <rect x="40" y="50" width="180" height="50" rx="8" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
            <text x="130" y="80" fill="#e2e8f0" text-anchor="middle">0101  (+5)</text>
            <text x="240" y="80" fill="#fbbf24" text-anchor="middle" font-family="Outfit,sans-serif">invert</text>
            <path d="M220 75 H260" stroke="#fbbf24" stroke-width="2"/>
            <rect x="270" y="50" width="180" height="50" rx="8" fill="rgba(251,191,36,.1)" stroke="#fbbf24"/>
            <text x="360" y="80" fill="#e2e8f0" text-anchor="middle">1010</text>
            <text x="470" y="80" fill="#2dd4bf" text-anchor="middle" font-family="Outfit,sans-serif">+1</text>
            <path d="M450 75 H490" stroke="#2dd4bf" stroke-width="2"/>
            <rect x="500" y="50" width="180" height="50" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
            <text x="590" y="80" fill="#e2e8f0" text-anchor="middle">1011  (−5)</text>
          </g>
          <text x="130" y="130" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">bit[3]=0 sign</text>
          <text x="590" y="130" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">bit[3]=1 sign</text>
          <text x="360" y="175" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Same bits 1011 = 11 unsigned, but −5 when declared signed</text>
        </svg>