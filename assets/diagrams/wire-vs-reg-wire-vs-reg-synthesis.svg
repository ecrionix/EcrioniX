<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="wire vs reg synthesis">
          <text x="360" y="30" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Source code → What synthesis builds</text>
          <rect x="40" y="50" width="200" height="80" rx="8" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/>
          <text x="140" y="80" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">wire + assign</text>
          <text x="140" y="105" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">assign y = a &amp; b;</text>
          <polygon points="270,90 310,90 300,80 320,95 300,110 310,100 270,100" fill="#94a3b8"/>
          <rect x="340" y="50" width="200" height="80" rx="8" fill="rgba(45,212,191,.1)" stroke="#2dd4bf"/>
          <text x="440" y="80" fill="#2dd4bf" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Combinational gate</text>
          <text x="440" y="105" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">AND cell, no storage</text>
          <rect x="40" y="160" width="200" height="80" rx="8" fill="rgba(167,139,250,.1)" stroke="#a78bfa"/>
          <text x="140" y="190" fill="#a78bfa" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">reg + always @(posedge)</text>
          <text x="140" y="215" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">q &lt;= d;</text>
          <polygon points="270,200 310,200 300,190 320,205 300,220 310,210 270,210" fill="#94a3b8"/>
          <rect x="340" y="160" width="200" height="80" rx="8" fill="rgba(251,191,36,.1)" stroke="#fbbf24"/>
          <text x="440" y="190" fill="#fbbf24" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">D flip-flop</text>
          <text x="440" y="215" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Storage element</text>
          <rect x="580" y="160" width="120" height="80" rx="8" fill="rgba(167,139,250,.1)" stroke="#a78bfa"/>
          <text x="640" y="190" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">reg + always @(*)</text>
          <text x="640" y="215" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">→ combo logic</text>
        </svg>