<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline fill steady drain phases">
<defs><marker id="m81-phase" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
<text x="320" y="20" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Three phases — N=3 stages, K=5 ops</text>
<rect x="30" y="40" width="90" height="28" rx="4" fill="rgba(251,191,36,.12)" stroke="#fbbf24"/><text x="75" y="58" fill="#fbbf24" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Fill (2 cyc)</text>
<rect x="130" y="40" width="280" height="28" rx="4" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/><text x="270" y="58" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Steady state (3 cyc) — 1 result/cycle</text>
<rect x="420" y="40" width="90" height="28" rx="4" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/><text x="465" y="58" fill="#a78bfa" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Drain (2 cyc)</text>
<text x="75" y="90" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">stages fill</text>
<text x="270" y="90" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">all stages busy</text>
<text x="465" y="90" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">no new inputs</text>
<text x="50" y="120" fill="#94a3b8" font-size="9" font-family="Outfit,sans-serif">Cycle</text>
<text x="90" y="120" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">1</text>
<text x="130" y="120" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">2</text>
<text x="170" y="120" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">3</text>
<text x="210" y="120" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">4</text>
<text x="250" y="120" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">5</text>
<text x="290" y="120" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">6</text>
<text x="330" y="120" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">7</text>
<rect x="80" y="130" width="36" height="18" rx="3" fill="#0c1526" stroke="#fbbf24"/><text x="98" y="142" fill="#fbbf24" font-size="7" text-anchor="middle" font-family="monospace">op0</text>
<rect x="120" y="130" width="36" height="18" rx="3" fill="#0c1526" stroke="#2dd4bf"/><text x="138" y="142" fill="#2dd4bf" font-size="7" text-anchor="middle" font-family="monospace">op0</text>
<rect x="120" y="152" width="36" height="18" rx="3" fill="#0c1526" stroke="#fbbf24"/><text x="138" y="164" fill="#fbbf24" font-size="7" text-anchor="middle" font-family="monospace">op1</text>
<rect x="160" y="130" width="36" height="18" rx="3" fill="#0c1526" stroke="#2dd4bf"/><text x="178" y="142" fill="#2dd4bf" font-size="7" text-anchor="middle" font-family="monospace">op0</text>
<rect x="160" y="152" width="36" height="18" rx="3" fill="#0c1526" stroke="#2dd4bf"/><text x="178" y="164" fill="#2dd4bf" font-size="7" text-anchor="middle" font-family="monospace">op1</text>
<rect x="160" y="174" width="36" height="18" rx="3" fill="#0c1526" stroke="#fbbf24"/><text x="178" y="186" fill="#fbbf24" font-size="7" text-anchor="middle" font-family="monospace">op2</text>
<line x1="60" y1="65" x2="60" y2="125" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="410" y1="65" x2="410" y2="125" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,2"/>
<text x="320" y="198" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Total cycles = (N + K − 1) · T — only the middle K−(N−1) cycles hit peak throughput</text>
</svg>