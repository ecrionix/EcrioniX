<text x="520" y="75" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Flop bank</text>
<text x="520" y="95" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">reg [31:0] data_q</text>
<text x="520" y="115" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">no toggle when gated</text>
<line x1="120" y1="90" x2="160" y2="90" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m911-arr)"/>
