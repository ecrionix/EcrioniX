<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Integrated clock gating cell">
<defs><marker id="m911-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
<text x="320" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Integrated Clock Gate (ICG) — RTL enable → physical gating</text>
<rect x="40" y="70" width="80" height="40" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="80" y="88" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">clk_in</text><text x="80" y="102" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">root clock</text>
<rect x="160" y="55" width="120" height="70" rx="8" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="220" y="78" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">ICG cell</text>
<text x="220" y="95" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">latch enable</text>
<text x="220" y="110" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">AND gated clk</text>
<rect x="160" y="140" width="120" height="30" rx="4" fill="#0c1526" stroke="#a78bfa"/><text x="220" y="160" fill="#a78bfa" font-size="8" text-anchor="middle" font-family="monospace">enable (from RTL)</text>
<rect x="320" y="60" width="90" height="35" rx="6" fill="#0c1526" stroke="#2dd4bf"/><text x="365" y="82" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">gated_clk</text>
