<line x1="220" y1="140" x2="220" y2="125" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m911-arr)"/>
<text x="400" y="58" fill="#2dd4bf" font-size="7" font-family="monospace">gated_clk→CK</text>
<text x="320" y="195" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Never gate clk with combo logic in RTL — use enable style; tool inserts safe ICG</text>
