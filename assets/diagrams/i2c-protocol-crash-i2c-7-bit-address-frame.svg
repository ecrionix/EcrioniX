<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="I2C 7-bit address frame">
<text x="360" y="22" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Address frame after START — 7 bits address + 1 bit R/W</text>
<rect x="60" y="50" width="55" height="40" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="87" y="75" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">A6</text>
<rect x="120" y="50" width="55" height="40" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="147" y="75" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">A5</text>
<rect x="180" y="50" width="55" height="40" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="207" y="75" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">A4</text>
<rect x="240" y="50" width="55" height="40" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="267" y="75" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">A3</text>
<rect x="300" y="50" width="55" height="40" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="327" y="75" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">A2</text>
<rect x="360" y="50" width="55" height="40" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="387" y="75" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">A1</text>
<rect x="420" y="50" width="55" height="40" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="447" y="75" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">A0</text>
<rect x="490" y="50" width="70" height="40" rx="4" fill="rgba(251,191,36,.15)" stroke="#fbbf24"/><text x="525" y="75" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="monospace">R/W</text>
<rect x="580" y="50" width="70" height="40" rx="4" fill="rgba(167,139,250,.15)" stroke="#a78bfa"/><text x="615" y="75" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="monospace">ACK</text>
<text x="87" y="110" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="Outfit,sans-serif">MSB</text>
<text x="447" y="110" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="Outfit,sans-serif">LSB</text>
<text x="525" y="110" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="Outfit,sans-serif">0=write 1=read</text>
<text x="615" y="110" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="Outfit,sans-serif">from slave</text>
<rect x="80" y="135" width="560" height="50" rx="8" fill="#0c1526" stroke="rgba(148,163,184,.15)"/>
<text x="360" y="158" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="monospace">Example: slave 0x50 write → bus byte = 0x50 &lt;&lt; 1 | 0 = 0xA0</text>
<text x="360" y="175" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">Example: slave 0x50 read  → bus byte = 0x50 &lt;&lt; 1 | 1 = 0xA1</text>
</svg>