<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="8-bit vector part-select">
          <text x="360" y="28" fill="#38bdf8" font-size="14" text-anchor="middle" font-family="Outfit,sans-serif">data[7:0] — MSB on the left</text>
          <rect x="80" y="50" width="70" height="50" rx="6" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="115" y="80" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="JetBrains Mono,monospace">[7]</text>
          <rect x="155" y="50" width="70" height="50" rx="6" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/><text x="190" y="80" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="JetBrains Mono,monospace">[6]</text>
          <rect x="230" y="50" width="70" height="50" rx="6" fill="rgba(56,189,248,.08)" stroke="#38bdf8"/><text x="265" y="80" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="JetBrains Mono,monospace">[5]</text>
          <rect x="305" y="50" width="70" height="50" rx="6" fill="rgba(45,212,191,.15)" stroke="#2dd4bf"/><text x="340" y="80" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="JetBrains Mono,monospace">[4:3]</text>
          <rect x="380" y="50" width="70" height="50" rx="6" fill="rgba(56,189,248,.08)" stroke="#38bdf8"/><text x="415" y="80" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="JetBrains Mono,monospace">[2]</text>
          <rect x="455" y="50" width="70" height="50" rx="6" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/><text x="490" y="80" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="JetBrains Mono,monospace">[1]</text>
          <rect x="530" y="50" width="70" height="50" rx="6" fill="rgba(167,139,250,.15)" stroke="#a78bfa"/><text x="565" y="80" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="JetBrains Mono,monospace">[0]</text>
          <text x="360" y="140" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">data[7] = MSB single bit · data[4:3] = 2-bit slice · data[0] = LSB</text>
          <text x="360" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Part-select width = |msb − lsb| + 1</text>
        </svg>