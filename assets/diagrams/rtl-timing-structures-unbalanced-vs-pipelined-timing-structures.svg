<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Unbalanced vs pipelined timing structures">
<defs><marker id="m99-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
<text x="340" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Same function — different timing shape</text>
<text x="170" y="48" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Killer: one-cycle cloud</text>
<rect x="40" y="60" width="50" height="30" rx="4" fill="#0c1526" stroke="#38bdf8"/><text x="65" y="80" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">FF</text>
<rect x="100" y="55" width="140" height="40" rx="6" fill="rgba(248,113,113,.15)" stroke="#f87171"/>
<text x="170" y="72" fill="#f87171" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">cmp→mux→add→cmp</text>
<text x="170" y="86" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">~1.2 ns @ 28nm</text>
<rect x="250" y="60" width="50" height="30" rx="4" fill="#0c1526" stroke="#2dd4bf"/><text x="275" y="80" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">FF</text>
<line x1="90" y1="75" x2="100" y2="75" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m99-arr)"/>
<line x1="240" y1="75" x2="250" y2="75" stroke="#f87171" stroke-width="1.5" marker-end="url(#m99-arr)"/>
<text x="510" y="48" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Friend: 2-stage pipe</text>
<rect x="360" y="60" width="40" height="28" rx="4" fill="#0c1526" stroke="#38bdf8"/><text x="380" y="78" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">FF</text>
<rect x="410" y="58" width="70" height="32" rx="4" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/><text x="445" y="78" fill="#38bdf8" font-size="7" text-anchor="middle" font-family="monospace">cmp+mux</text>
<rect x="490" y="60" width="40" height="28" rx="4" fill="#0c1526" stroke="#a78bfa"/><text x="510" y="78" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">FF</text>
<rect x="540" y="58" width="70" height="32" rx="4" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/><text x="575" y="78" fill="#2dd4bf" font-size="7" text-anchor="middle" font-family="monospace">add</text>
<rect x="620" y="60" width="40" height="28" rx="4" fill="#0c1526" stroke="#2dd4bf"/><text x="640" y="78" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">FF</text>
<line x1="400" y1="74" x2="410" y2="74" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m99-arr)"/>
<line x1="480" y1="74" x2="490" y2="74" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m99-arr)"/>
<line x1="530" y1="74" x2="540" y2="74" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m99-arr)"/>
<line x1="610" y1="74" x2="620" y2="74" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m99-arr)"/>
<text x="170" y="120" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">1 cycle latency · may fail timing</text>
<text x="510" y="120" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">2 cycle latency · each stage ~0.4 ns</text>
<rect x="80" y="145" width="520" height="95" rx="8" fill="#0c1526" stroke="#a78bfa"/>
<text x="340" y="168" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Unbalanced if-tree (linear priority)</text>
<text x="120" y="195" fill="#f87171" font-size="8" font-family="monospace">if(s0)→if(s1)→if(s2)→...→if(s15)</text>
<text x="120" y="215" fill="#94a3b8" font-size="8" font-family="Outfit,sans-serif">16 mux levels worst case</text>
<text x="420" y="195" fill="#2dd4bf" font-size="8" font-family="monospace">case(onehot) + reg</text>
<text x="420" y="215" fill="#94a3b8" font-size="8" font-family="Outfit,sans-serif">1 mux level + 1 cycle delay</text>
</svg>