<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open drain pad RTL model">
<text x="350" y="22" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">i2c_od_pad — drive low or release</text>
<rect x="80" y="55" width="140" height="70" rx="8" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
<text x="150" y="85" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">bit_engine</text>
<text x="150" y="105" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">sda_o, sda_oen_n</text>
<rect x="280" y="55" width="140" height="70" rx="8" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="350" y="85" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">od_pad_cell</text>
<text x="350" y="105" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">assign bus</text>
<rect x="480" y="55" width="140" height="70" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="550" y="85" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">bus + Rp</text>
<text x="550" y="105" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">sda_io</text>
<line x1="220" y1="90" x2="280" y2="90" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m113-arr)"/>
<line x1="420" y1="90" x2="480" y2="90" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m113-arr)"/>
<line x1="480" y1="105" x2="420" y2="105" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#m113-arr)"/>
<text x="450" y="118" fill="#a78bfa" font-size="7" font-family="monospace">sda_i</text>
<rect x="100" y="150" width="500" height="55" rx="8" fill="#0c1526" stroke="rgba(148,163,184,.15)"/>
<text x="350" y="172" fill="#e2e8f0" font-size="8" text-anchor="middle" font-family="monospace">assign sda_pad = sda_oen_n ? 1'bz : 1'b0;</text>
<text x="350" y="190" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">assign sda_i = (sda_pad === 1'bz) ? 1'b1 : sda_pad;  // pull-up model</text>
</svg>