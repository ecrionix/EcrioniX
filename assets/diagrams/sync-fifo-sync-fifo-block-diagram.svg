<text x="85" y="118" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">wr_en, wdata</text>
<rect x="170" y="45" width="340" height="190" rx="12" fill="#0c1526" stroke="#a78bfa"/>
<text x="340" y="72" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Circular memory array [0:DEPTH-1]</text>
<rect x="200" y="90" width="50" height="40" rx="4" fill="#0c1526" stroke="#2dd4bf"/><text x="225" y="115" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">[0]</text>
<rect x="260" y="90" width="50" height="40" rx="4" fill="#0c1526" stroke="#2dd4bf"/><text x="285" y="115" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">[1]</text>
<rect x="320" y="90" width="50" height="40" rx="4" fill="rgba(45,212,191,.15)" stroke="#2dd4bf"/><text x="345" y="115" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="monospace">[2]←rd</text>
<rect x="380" y="90" width="50" height="40" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="405" y="115" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">[3]←wr</text>
<rect x="440" y="90" width="50" height="40" rx="4" fill="#0c1526" stroke="#94a3b8"/><text x="465" y="115" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">[4]</text>
<text x="250" y="165" fill="#38bdf8" font-size="9" font-family="monospace">wr_ptr = 3</text>
<text x="400" y="165" fill="#2dd4bf" font-size="9" font-family="monospace">rd_ptr = 2</text>
<text x="340" y="195" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">count = 1 (not full, not empty)</text>
<rect x="200" y="210" width="120" height="22" rx="5" fill="rgba(248,113,113,.1)" stroke="#f87171"/><text x="260" y="225" fill="#f87171" font-size="8" text-anchor="middle" font-family="monospace">full=0 empty=0</text>
<rect x="540" y="70" width="110" height="70" rx="8" fill="rgba(45,212,191,.1)" stroke="#2dd4bf"/>
