<svg viewBox="0 0 580 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clock as data violation">
<defs><marker id="m93-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker><marker id="m93-bad" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f87171"/></marker></defs>
<text x="290" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Clock vs enable — don't confuse them</text>
<rect x="30" y="55" width="240" height="130" rx="10" fill="#0c1526" stroke="#f87171"/>
<text x="150" y="78" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">BAD: clk as enable</text>
<rect x="55" y="95" width="50" height="30" rx="4" fill="#0c1526" stroke="#38bdf8"/><text x="80" y="114" fill="#38bdf8" font-size="8" text-anchor="middle" font-family="monospace">clk</text>
<rect x="130" y="95" width="60" height="30" rx="4" fill="#0c1526" stroke="#a78bfa"/><text x="160" y="114" fill="#a78bfa" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">AND</text>
<rect x="200" y="95" width="50" height="30" rx="4" fill="#0c1526" stroke="#2dd4bf"/><text x="225" y="114" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="monospace">DFF</text>
<line x1="105" y1="110" x2="130" y2="110" stroke="#f87171" stroke-width="1.5" marker-end="url(#m93-bad)"/>
<line x1="190" y1="110" x2="200" y2="110" stroke="#f87171" stroke-width="1.5" marker-end="url(#m93-bad)"/>
<text x="150" y="155" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">always @(posedge clk) if(clk) q&lt;=d</text>
<rect x="310" y="55" width="240" height="130" rx="10" fill="#0c1526" stroke="#2dd4bf"/>
<text x="430" y="78" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">GOOD: enable input</text>
<rect x="335" y="95" width="50" height="30" rx="4" fill="#0c1526" stroke="#38bdf8"/><text x="360" y="114" fill="#38bdf8" font-size="8" text-anchor="middle" font-family="monospace">clk</text>
<rect x="400" y="95" width="60" height="30" rx="4" fill="#0c1526" stroke="#2dd4bf"/><text x="430" y="114" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">DFF+EN</text>
<rect x="475" y="95" width="50" height="30" rx="4" fill="#0c1526" stroke="#a78bfa"/><text x="500" y="114" fill="#a78bfa" font-size="8" text-anchor="middle" font-family="monospace">en</text>
<line x1="385" y1="110" x2="400" y2="110" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m93-arr)"/>
<line x1="460" y1="110" x2="475" y2="110" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m93-arr)"/>
<text x="430" y="155" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">if(en) q&lt;=d inside posedge clk</text>
</svg>