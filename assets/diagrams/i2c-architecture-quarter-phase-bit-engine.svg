<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quarter phase bit engine">
<text x="360" y="20" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Bit engine internal phase counter</text>
<rect x="60" y="50" width="130" height="45" rx="8" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
<text x="125" y="72" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">PH_SETUP</text>
<text x="125" y="86" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">SDA valid, SCL low</text>
<rect x="210" y="50" width="130" height="45" rx="8" fill="rgba(251,191,36,.12)" stroke="#fbbf24"/>
<text x="275" y="72" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">PH_RISE</text>
<text x="275" y="86" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">release SCL oen</text>
<rect x="360" y="50" width="130" height="45" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="425" y="72" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">PH_HIGH</text>
<text x="425" y="86" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">sample SDA; wait scl_i</text>
<rect x="510" y="50" width="130" height="45" rx="8" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="575" y="72" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">PH_FALL</text>
<text x="575" y="86" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">pull SCL low</text>
<line x1="190" y1="72" x2="210" y2="72" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m113-arr)"/>
<line x1="340" y1="72" x2="360" y2="72" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m113-arr)"/>
<line x1="490" y1="72" x2="510" y2="72" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m113-arr)"/>
<rect x="120" y="120" width="480" height="60" rx="8" fill="#0c1526" stroke="rgba(148,163,184,.15)"/>
<text x="360" y="142" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="monospace">phase_cnt 0..DIV-1 per phase; full bit = 4 × DIV pclk cycles</text>
<text x="360" y="162" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">f_scl ≈ pclk / (4 × DIV)  →  DIV = pclk / (4 × f_target)</text>
</svg>