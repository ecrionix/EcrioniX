<svg viewBox="0 0 440 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Setup hold diagram">
<text x="220" y="16" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Setup &amp; hold around clock edge</text>
<line x1="40" y1="70" x2="400" y2="70" stroke="#38bdf8" stroke-width="2"/>
<text x="220" y="62" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">clk ↑</text>
<line x1="220" y1="40" x2="220" y2="100" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4"/>
<text x="230" y="95" fill="#f87171" font-size="8" font-family="Outfit,sans-serif">edge</text>
<rect x="100" y="78" width="110" height="18" rx="3" fill="rgba(251,191,36,.2)" stroke="#fbbf24"/>
