<svg viewBox="0 0 480 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grant hold FSM">
<defs><marker id="m65-holdmk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
<text x="240" y="22" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Grant-hold FSM — no re-arbitrate mid-burst</text>
<circle cx="120" cy="100" r="40" fill="#0c1526" stroke="#2dd4bf"/><text x="120" y="96" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">IDLE</text><text x="120" y="112" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">grant=0</text>
<circle cx="340" cy="100" r="40" fill="#0c1526" stroke="#a78bfa"/><text x="340" y="96" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">LOCKED</text><text x="340" y="112" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">hold gnt</text>
