<svg viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Active low vs active high reset naming">
          <text x="175" y="30" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">rst_n (active-low)</text>
          <path d="M40 70 H120 V45 H200 V70 H280" fill="none" stroke="#f87171" stroke-width="2"/>
          <text x="120" y="95" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">0 = reset ON</text>
          <text x="220" y="95" fill="#4ade80" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">1 = run</text>
          <text x="525" y="30" fill="#a78bfa" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">rst (active-high)</text>
          <path d="M390 70 H470 V45 H550 V70 H630" fill="none" stroke="#a78bfa" stroke-width="2"/>
          <text x="470" y="95" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">1 = reset ON</text>
          <text x="570" y="95" fill="#4ade80" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">0 = run</text>
          <text x="350" y="140" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Test: if (!rst_n) → active-low · if (rst) → active-high</text>
        </svg>