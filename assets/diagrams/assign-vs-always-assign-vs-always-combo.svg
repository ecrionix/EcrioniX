<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="assign vs always combo">
          <rect x="30" y="40" width="300" height="160" rx="10" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/>
          <text x="180" y="70" fill="#38bdf8" font-size="14" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="600">assign (continuous)</text>
          <text x="180" y="100" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">assign y = a &amp; b;</text>
          <text x="180" y="130" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">→ AND gate</text>
          <text x="180" y="160" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">No sensitivity list needed</text>
          <text x="180" y="185" fill="#4ade80" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Best: simple expressions</text>
          <rect x="390" y="40" width="300" height="160" rx="10" fill="rgba(167,139,250,.1)" stroke="#a78bfa"/>
          <text x="540" y="70" fill="#a78bfa" font-size="14" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="600">always @(*) (procedural)</text>
          <text x="540" y="100" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">case / if-else chains</text>
          <text x="540" y="130" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">→ MUX tree / LUT</text>
          <text x="540" y="160" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Sensitivity: all RHS inputs</text>
          <text x="540" y="185" fill="#4ade80" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Best: complex branching</text>
        </svg>