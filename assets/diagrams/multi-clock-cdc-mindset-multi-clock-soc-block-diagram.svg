<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Multi-clock SoC block diagram">
<defs><marker id="m95-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker><marker id="m95-cdc" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f87171"/></marker></defs>
<text x="340" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Typical SoC — many clocks, many CDC boundaries</text>
<rect x="30" y="45" width="120" height="70" rx="8" fill="#0c1526" stroke="#38bdf8"/><text x="90" y="72" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">CPU core</text><text x="90" y="90" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">clk_cpu 2 GHz</text>
<rect x="180" y="45" width="120" height="70" rx="8" fill="#0c1526" stroke="#a78bfa"/><text x="240" y="72" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">NoC / bus</text><text x="240" y="90" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">clk_noc 1 GHz</text>
<rect x="330" y="45" width="120" height="70" rx="8" fill="#0c1526" stroke="#2dd4bf"/><text x="390" y="72" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">DRAM ctrl</text><text x="390" y="90" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">clk_ddr 400 MHz</text>
<rect x="480" y="45" width="120" height="70" rx="8" fill="#0c1526" stroke="#fbbf24"/><text x="540" y="72" fill="#fbbf24" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Peripherals</text><text x="540" y="90" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">clk_periph 50 MHz</text>
<rect x="105" y="155" width="120" height="70" rx="8" fill="#0c1526" stroke="#2dd4bf"/><text x="165" y="182" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">PCIe PHY</text><text x="165" y="200" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">clk_pcie 125 MHz</text>
<rect x="280" y="155" width="120" height="70" rx="8" fill="#0c1526" stroke="#a78bfa"/><text x="340" y="182" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Always-on</text><text x="340" y="200" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">clk_aon 32 kHz</text>
<rect x="455" y="155" width="120" height="70" rx="8" fill="#0c1526" stroke="#38bdf8"/><text x="515" y="182" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Sensor I/F</text><text x="515" y="200" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">clk_sensor async</text>
<rect x="145" y="115" width="30" height="18" rx="4" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="160" y="128" fill="#f87171" font-size="6" text-anchor="middle" font-family="monospace">CDC</text>
<rect x="295" y="115" width="30" height="18" rx="4" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="310" y="128" fill="#f87171" font-size="6" text-anchor="middle" font-family="monospace">CDC</text>
<rect x="445" y="115" width="30" height="18" rx="4" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="460" y="128" fill="#f87171" font-size="6" text-anchor="middle" font-family="monospace">CDC</text>
<line x1="90" y1="115" x2="160" y2="155" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#m95-cdc)"/>
<line x1="240" y1="115" x2="310" y2="155" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#m95-cdc)"/>
<line x1="390" y1="115" x2="460" y2="133" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#m95-cdc)"/>
<line x1="150" y1="115" x2="165" y2="155" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#m95-cdc)"/>
<line x1="300" y1="115" x2="340" y2="155" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#m95-cdc)"/>
<line x1="450" y1="115" x2="515" y2="155" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#m95-cdc)"/>
<text x="340" y="255" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Every red CDC boundary needs a designed synchronizer strategy</text>
</svg>