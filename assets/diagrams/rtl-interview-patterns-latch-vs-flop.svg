<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Latch vs flop">
<text x="200" y="18" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Latch vs D-flop — interviewer mental model</text>
<rect x="20" y="40" width="150" height="60" rx="8" fill="rgba(248,113,113,.1)" stroke="#f87171"/>
<text x="95" y="65" fill="#f87171" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">LATCH</text>
<text x="95" y="82" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">level-sensitive</text>
<text x="95" y="94" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">inferred from incomplete case</text>
<rect x="230" y="40" width="150" height="60" rx="8" fill="rgba(74,222,128,.1)" stroke="#4ade80"/>
<text x="305" y="65" fill="#4ade80" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">D-FLOP</text>
<text x="305" y="82" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">edge-triggered</text>
<text x="305" y="94" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">posedge clk always block</text>
</svg>