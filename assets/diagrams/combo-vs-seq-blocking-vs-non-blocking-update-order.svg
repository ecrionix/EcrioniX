<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blocking vs non-blocking update order">
          <text x="180" y="35" fill="#f87171" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Blocking (=) — serial</text>
          <rect x="60" y="50" width="100" height="40" rx="6" fill="rgba(248,113,113,.12)" stroke="#f87171"/><text x="110" y="75" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">a = b</text>
          <path d="M160 70 H200" stroke="#f87171"/><rect x="200" y="50" width="100" height="40" rx="6" fill="rgba(248,113,113,.12)" stroke="#f87171"/><text x="250" y="75" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">c = a</text>
          <text x="180" y="115" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">c sees new a (same cycle)</text>
          <text x="540" y="35" fill="#4ade80" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Non-blocking (&lt;=) — parallel</text>
          <rect x="420" y="50" width="100" height="40" rx="6" fill="rgba(74,222,128,.12)" stroke="#4ade80"/><text x="470" y="75" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">a &lt;= b</text>
          <rect x="560" y="50" width="100" height="40" rx="6" fill="rgba(74,222,128,.12)" stroke="#4ade80"/><text x="610" y="75" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">c &lt;= a</text>
          <text x="540" y="115" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">both read old values, then update together</text>
          <text x="360" y="165" fill="#fbbf24" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Mini-lab below: swap two regs — only &lt;= works like hardware</text>
        </svg>