<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
          <rect x="40" y="30" width="280" height="140" rx="12" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/>
          <text x="180" y="60" fill="#38bdf8" font-size="14" text-anchor="middle" font-family="Outfit,sans-serif">Unsigned 8-bit</text>
          <text x="180" y="95" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">0 … 255</text>
          <text x="180" y="125" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="JetBrains Mono,monospace">8'b11111111 = 255</text>
          <text x="180" y="150" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">No sign bit</text>
          <rect x="380" y="30" width="280" height="140" rx="12" fill="rgba(167,139,250,.1)" stroke="#a78bfa"/>
          <text x="520" y="60" fill="#a78bfa" font-size="14" text-anchor="middle" font-family="Outfit,sans-serif">Signed 8-bit (2's comp)</text>
          <text x="520" y="95" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">−128 … +127</text>
          <text x="520" y="125" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="JetBrains Mono,monospace">8'sb11111111 = −1</text>
          <text x="520" y="150" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">MSB is sign</text>
        </svg>