<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bus tearing across clock domains">
<defs><marker id="m97-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
<text x="340" y="22" fill="#f87171" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Bus tearing — binary counter 0111 → 1000</text>
<rect x="30" y="45" width="120" height="55" rx="8" fill="#0c1526" stroke="#38bdf8"/><text x="90" y="68" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">clk_a domain</text><text x="90" y="88" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="monospace">count = 0111→1000</text>
<rect x="200" y="50" width="280" height="45" rx="6" fill="rgba(248,113,113,.12)" stroke="#f87171"/>
<text x="340" y="72" fill="#f87171" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Multi-bit wire — no atomic transfer</text>
<text x="340" y="88" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">b0 settles first, b3 last → sample = 1111?</text>
<rect x="530" y="45" width="120" height="55" rx="8" fill="#0c1526" stroke="#a78bfa"/><text x="590" y="68" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">clk_b domain</text><text x="590" y="88" fill="#f87171" font-size="9" text-anchor="middle" font-family="monospace">reads 0111 or 1xxx</text>
<line x1="150" y1="72" x2="200" y2="72" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m97-arr)"/>
<line x1="480" y1="72" x2="530" y2="72" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m97-arr)"/>
<text x="90" y="130" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">0111</text>
<text x="200" y="130" fill="#f87171" font-size="8" font-family="monospace">0</text><text x="230" y="130" fill="#f87171" font-size="8" font-family="monospace">1</text><text x="260" y="130" fill="#f87171" font-size="8" font-family="monospace">1</text><text x="290" y="130" fill="#f87171" font-size="8" font-family="monospace">1</text>
<text x="340" y="130" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">impossible hybrid</text>
<text x="590" y="130" fill="#f87171" font-size="8" text-anchor="middle" font-family="monospace">≠ 0111 ≠ 1000</text>
<rect x="80" y="155" width="520" height="70" rx="8" fill="#0c1526" stroke="#2dd4bf"/>
<text x="340" y="178" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Safe alternatives</text>
<text x="160" y="200" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Gray counter + 2-FF each bit</text>
<text x="340" y="200" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Async FIFO (ptr sync)</text>
<text x="520" y="200" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Req/ack handshake</text>
</svg>