<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="I2C multi-drop bus topology">
<text x="360" y="24" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">I2C bus — one master, multiple slaves, shared SCL/SDA</text>
<rect x="40" y="70" width="130" height="80" rx="10" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
<text x="105" y="100" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Master</text>
<text x="105" y="118" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">SoC I2C IP</text>
<text x="105" y="134" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">generates SCL</text>
<line x1="170" y1="110" x2="170" y2="95" stroke="#38bdf8" stroke-width="1.5"/>
<line x1="170" y1="110" x2="170" y2="125" stroke="#2dd4bf" stroke-width="1.5"/>
<line x1="170" y1="95" x2="550" y2="95" stroke="#38bdf8" stroke-width="2"/>
<text x="360" y="88" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">SCL (clock)</text>
<line x1="170" y1="125" x2="550" y2="125" stroke="#2dd4bf" stroke-width="2"/>
<text x="360" y="140" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="monospace">SDA (data)</text>
<rect x="200" y="170" width="100" height="55" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="250" y="195" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Slave 0x50</text>
<text x="250" y="212" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">EEPROM</text>
<rect x="340" y="170" width="100" height="55" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="390" y="195" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Slave 0x48</text>
<text x="390" y="212" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">Temp sensor</text>
<rect x="480" y="170" width="100" height="55" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="530" y="195" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Slave 0x68</text>
<text x="530" y="212" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">IMU</text>
<line x1="238" y1="170" x2="238" y2="95" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="262" y1="170" x2="262" y2="125" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="378" y1="170" x2="378" y2="95" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="402" y1="170" x2="402" y2="125" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="518" y1="170" x2="518" y2="95" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="542" y1="170" x2="542" y2="125" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="280" y="235" width="160" height="18" rx="4" fill="rgba(251,191,36,.1)" stroke="#fbbf24"/>
<text x="360" y="248" fill="#fbbf24" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">External pull-ups Rp on SCL and SDA to VDD</text>
</svg>