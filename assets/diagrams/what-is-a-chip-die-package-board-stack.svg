<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Die package board stack">
        <rect x="200" y="10" width="240" height="35" rx="6" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/>
        <text x="320" y="33" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">PCB — capacitors, crystals, connectors</text>
        <rect x="220" y="55" width="200" height="35" rx="6" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
        <text x="320" y="78" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Package — bond wires, heat spreader</text>
        <rect x="240" y="100" width="160" height="35" rx="6" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
        <text x="320" y="123" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Die — your RTL becomes transistors</text>
