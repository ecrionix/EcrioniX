<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="D flip-flop gate symbol vs RTL block">
          <defs><marker id="arr51a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker></defs>
          <text x="170" y="28" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Gate-level symbol</text>
          <text x="510" y="28" fill="#2dd4bf" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">RTL abstraction</text>
          <rect x="100" y="60" width="140" height="140" rx="8" fill="#0c1526" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="170" y="95" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">DFF</text>
          <text x="170" y="115" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">library cell</text>
          <text x="55" y="100" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">D</text>
          <line x1="65" y1="97" x2="100" y2="97" stroke="#38bdf8" marker-end="url(#arr51a)"/>
          <text x="40" y="140" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">CLK</text>
          <line x1="50" y1="137" x2="100" y2="150" stroke="#a78bfa" marker-end="url(#arr51a)"/>
          <text x="30" y="175" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">rst_n</text>
          <line x1="40" y1="172" x2="100" y2="185" stroke="#f87171" marker-end="url(#arr51a)"/>
          <text x="255" y="100" fill="#e2e8f0" font-size="11" font-family="Outfit,sans-serif">Q</text>
          <line x1="240" y1="97" x2="280" y2="97" stroke="#2dd4bf" marker-end="url(#arr51a)"/>
          <text x="255" y="175" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">Qn</text>
          <line x1="240" y1="172" x2="280" y2="172" stroke="#94a3b8" marker-end="url(#arr51a)"/>
          <line x1="340" y1="40" x2="340" y2="220" stroke="#94a3b8" stroke-dasharray="4 4"/>
          <rect x="400" y="70" width="220" height="120" rx="10" fill="#0c1526" stroke="#2dd4bf"/>
          <text x="510" y="100" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">always @(posedge clk)</text>
          <text x="510" y="120" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">  if (!rst_n) q &lt;= 0;</text>
          <text x="510" y="140" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">  else      q &lt;= d;</text>
          <text x="510" y="170" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">synthesis → DFF cell</text>
          <text x="340" y="245" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">You write behavior; the tool picks the physical FF with correct reset polarity</text>
        </svg>