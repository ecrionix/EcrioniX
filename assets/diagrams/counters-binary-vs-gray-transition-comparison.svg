<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Binary vs Gray transition comparison">
          <text x="160" y="28" fill="#f87171" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Binary: 3 → 4</text>
          <text x="480" y="28" fill="#2dd4bf" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Gray: 2 → 3</text>
          <text x="60" y="70" fill="#94a3b8" font-size="11" font-family="JetBrains Mono,monospace">011</text>
          <text x="200" y="70" fill="#94a3b8" font-size="11" font-family="JetBrains Mono,monospace">100</text>
          <text x="130" y="68" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">3 bits flip!</text>
          <line x1="90" y1="75" x2="190" y2="75" stroke="#f87171" stroke-width="2"/>
          <text x="380" y="70" fill="#94a3b8" font-size="11" font-family="JetBrains Mono,monospace">010</text>
          <text x="520" y="70" fill="#94a3b8" font-size="11" font-family="JetBrains Mono,monospace">011</text>
          <text x="450" y="68" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">1 bit flips</text>
          <line x1="410" y1="75" x2="510" y2="75" stroke="#2dd4bf" stroke-width="2"/>
          <rect x="40" y="100" width="260" height="90" rx="8" fill="#0c1526" stroke="#f87171"/>
          <text x="170" y="130" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Sync sample may read</text>
          <text x="170" y="150" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">010, 110, 000, … (invalid)</text>
          <text x="170" y="175" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">FIFO full/empty corruption</text>
          <rect x="340" y="100" width="260" height="90" rx="8" fill="#0c1526" stroke="#2dd4bf"/>
          <text x="470" y="130" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Sync sample reads</text>
          <text x="470" y="150" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">010 or 011 only</text>
          <text x="470" y="175" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Off-by-one is safe for FIFO</text>
        </svg>