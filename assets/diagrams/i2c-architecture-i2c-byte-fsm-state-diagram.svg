<rect x="360" y="120" width="100" height="40" rx="8" fill="rgba(251,191,36,.12)" stroke="#fbbf24"/>
<text x="410" y="145" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">DATA</text>
<rect x="500" y="120" width="100" height="40" rx="8" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="550" y="145" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">ACK_CHK</text>
<rect x="620" y="120" width="80" height="40" rx="8" fill="rgba(248,113,113,.12)" stroke="#f87171"/>
<text x="660" y="145" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">STOP</text>
