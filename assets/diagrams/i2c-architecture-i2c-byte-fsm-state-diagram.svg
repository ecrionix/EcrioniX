<path d="M360,85 L360,110 L130,110 L130,120" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#m113-arr2)"/>
<text x="240" y="105" fill="#94a3b8" font-size="7" font-family="Outfit,sans-serif">cmd.start</text>
<path d="M180,160 L220,160 L220,140" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#m113-arr2)"/>
<path d="M320,140 L360,140" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#m113-arr2)"/>
<text x="340" y="133" fill="#94a3b8" font-size="7" font-family="Outfit,sans-serif">8 bits</text>
<path d="M460,140 L500,140" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#m113-arr2)"/>
<path d="M600,140 L620,140" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#m113-arr2)"/>
<text x="610" y="133" fill="#94a3b8" font-size="7" font-family="Outfit,sans-serif">9th bit</text>
