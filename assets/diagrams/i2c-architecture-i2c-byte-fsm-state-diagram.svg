<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="I2C byte FSM state diagram">
<defs><marker id="m113-arr2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<text x="360" y="22" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Byte FSM — main states</text>
<rect x="300" y="45" width="120" height="40" rx="20" fill="rgba(45,212,191,.15)" stroke="#2dd4bf"/>
<text x="360" y="70" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">IDLE</text>
<rect x="80" y="120" width="100" height="40" rx="8" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
<text x="130" y="145" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">START</text>
