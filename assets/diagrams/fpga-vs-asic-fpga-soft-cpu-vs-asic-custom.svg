          <rect x="410" y="85" width="100" height="35" rx="6" fill="rgba(167,139,250,.25)" stroke="#a78bfa"/><text x="460" y="107" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">hard CPU</text>
          <rect x="530" y="85" width="130" height="35" rx="6" fill="#0c1526" stroke="#94a3b8"/><text x="595" y="107" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">custom accelerators</text>
          <text x="530" y="155" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Fixed layout · best PPA at scale</text>
        </svg>