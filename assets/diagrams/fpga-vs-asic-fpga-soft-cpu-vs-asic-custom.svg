<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FPGA soft CPU vs ASIC custom">
          <rect x="40" y="40" width="300" height="130" rx="10" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/>
          <text x="190" y="70" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">FPGA fabric</text>
          <rect x="70" y="85" width="90" height="35" rx="6" fill="rgba(45,212,191,.2)" stroke="#2dd4bf"/><text x="115" y="107" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">soft CPU</text>
          <rect x="180" y="85" width="130" height="35" rx="6" fill="#0c1526" stroke="#94a3b8"/><text x="245" y="107" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">your RTL peripherals</text>
          <text x="190" y="155" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Reprogrammable · LUT/BRAM cost</text>
          <rect x="380" y="40" width="300" height="130" rx="10" fill="rgba(167,139,250,.1)" stroke="#a78bfa"/>
