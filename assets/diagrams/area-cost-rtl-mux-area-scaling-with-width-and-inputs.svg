<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mux area scaling with width and inputs">
<text x="310" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Mux area grows with data width × number of inputs</text>
<rect x="40" y="50" width="100" height="60" rx="8" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
<text x="90" y="75" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">2:1 mux</text>
<text x="90" y="95" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">32-bit → ~32 TG</text>
<rect x="180" y="50" width="100" height="60" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="230" y="75" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">8:1 mux</text>
<text x="230" y="95" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">32-bit → ~3× cost</text>
<rect x="320" y="50" width="100" height="60" rx="8" fill="rgba(248,113,113,.12)" stroke="#f87171"/>
<text x="370" y="75" fill="#f87171" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">256:1 mux</text>
<text x="370" y="95" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">32-bit → huge</text>
<rect x="460" y="50" width="120" height="60" rx="8" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="520" y="75" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Two-stage</text>
<text x="520" y="95" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">16:1 + 16:1</text>
<text x="310" y="145" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Break wide selects into address + sub-mux, or use RAM port</text>
<text x="310" y="175" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Regfile: N×W storage + one read mux — mux is not free</text>
</svg>