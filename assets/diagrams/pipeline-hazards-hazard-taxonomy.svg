<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hazard taxonomy">
<defs><marker id="m82-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
<text x="320" y="24" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Pipeline hazard map</text>
<rect x="240" y="40" width="160" height="36" rx="8" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="320" y="63" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Hazards</text>
<rect x="40" y="110" width="150" height="50" rx="8" fill="#0c1526" stroke="#f87171"/><text x="115" y="132" fill="#f87171" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Structural</text><text x="115" y="148" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">resource conflict</text>
<rect x="245" y="110" width="150" height="50" rx="8" fill="#0c1526" stroke="#a78bfa"/><text x="320" y="132" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Data</text><text x="320" y="148" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">RAW / WAR / WAW</text>
<rect x="450" y="110" width="150" height="50" rx="8" fill="#0c1526" stroke="#2dd4bf"/><text x="525" y="132" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Control</text><text x="525" y="148" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">branch / jump</text>
<line x1="280" y1="76" x2="115" y2="110" stroke="#f87171" stroke-width="1.5" marker-end="url(#m82-arr)"/>
<line x1="320" y1="76" x2="320" y2="110" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m82-arr)"/>
<line x1="360" y1="76" x2="525" y2="110" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m82-arr)"/>
<text x="320" y="185" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">RAW is the dominant data hazard in in-order pipelines</text>
