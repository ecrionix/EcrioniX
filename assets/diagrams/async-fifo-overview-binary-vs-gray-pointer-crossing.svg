<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Binary vs Gray pointer crossing">
<defs><marker id="m73-bg-x" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f87171"/></marker></defs>
<text x="155" y="28" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Binary 0111 → 1000</text>
<text x="465" y="28" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Gray 0100 → 1100</text>
<rect x="40" y="45" width="230" height="160" rx="10" fill="#0c1526" stroke="#f87171"/>
<text x="155" y="75" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">bit3: 0→1</text>
<text x="155" y="95" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">bit2: 1→0</text>
<text x="155" y="115" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">bit1: 1→0</text>
<text x="155" y="135" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">bit0: 1→0</text>
<text x="155" y="175" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">4 bits change — sync reads garbage</text>
<rect x="350" y="45" width="230" height="160" rx="10" fill="#0c1526" stroke="#2dd4bf"/>
<text x="465" y="85" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">bit3: 0→1</text>
<text x="465" y="105" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">bit2: 1→1 (unchanged)</text>
<text x="465" y="125" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">bit1: 0→1</text>
<text x="465" y="145" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">bit0: 0→0 (unchanged)</text>
<text x="465" y="185" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">1 bit changes — safe sync</text>
<line x1="270" y1="125" x2="350" y2="125" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
</svg>