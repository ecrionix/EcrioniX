<svg viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Repeated START transaction">
<text x="360" y="20" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Write-then-read — S … data … Sr … read … P</text>
<text x="50" y="55" fill="#94a3b8" font-size="9" font-family="monospace">SCL</text>
<polyline points="80,50 600,50 620,70 640,70 660,50" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="50" y="95" fill="#94a3b8" font-size="9" font-family="monospace">SDA</text>
<polyline points="80,90 95,90 95,110 200,110 220,90 400,90 415,110 415,90 430,90 550,90 565,110 600,110" fill="none" stroke="#2dd4bf" stroke-width="2"/>
<text x="90" y="125" fill="#f87171" font-size="8" font-family="Outfit,sans-serif">S</text>
<text x="410" y="125" fill="#f87171" font-size="8" font-family="Outfit,sans-serif">Sr</text>
<text x="590" y="125" fill="#4ade80" font-size="8" font-family="Outfit,sans-serif">P</text>
<rect x="100" y="140" width="180" height="28" rx="5" fill="rgba(56,189,248,.08)" stroke="#38bdf8"/>
<text x="190" y="158" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Phase 1: addr+W, reg ptr</text>
<rect x="420" y="140" width="180" height="28" rx="5" fill="rgba(167,139,250,.08)" stroke="#a78bfa"/>
<text x="510" y="158" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Phase 2: addr+R, read data</text>
</svg>