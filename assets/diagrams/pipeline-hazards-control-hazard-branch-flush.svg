<svg viewBox="0 0 560 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Control hazard branch flush">
<text x="280" y="22" fill="#2dd4bf" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Branch taken — flush IF and ID bubbles</text>
<rect x="30" y="45" width="500" height="24" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="3,2"/>
<text x="280" y="62" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Pipeline snapshot when branch resolves TAKEN in EX</text>
<rect x="50" y="85" width="70" height="28" rx="4" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="85" y="103" fill="#f87171" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">IF wrong</text>
<rect x="140" y="85" width="70" height="28" rx="4" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="175" y="103" fill="#f87171" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">ID wrong</text>
<rect x="230" y="85" width="70" height="28" rx="4" fill="#0c1526" stroke="#38bdf8"/><text x="265" y="103" fill="#e2e8f0" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">EX br</text>
<rect x="320" y="85" width="70" height="28" rx="4" fill="#0c1526" stroke="#a78bfa"/><text x="355" y="103" fill="#e2e8f0" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">MEM</text>
<rect x="410" y="85" width="70" height="28" rx="4" fill="#0c1526" stroke="#2dd4bf"/><text x="445" y="103" fill="#e2e8f0" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">WB</text>
<text x="85" y="135" fill="#f87171" font-size="8" text-anchor="middle" font-family="monospace">flush→NOP</text>
<text x="175" y="135" fill="#f87171" font-size="8" text-anchor="middle" font-family="monospace">flush→NOP</text>
<text x="265" y="135" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="monospace">redirect PC</text>
<text x="280" y="165" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Penalty = flushed stages (2 for IF+ID) unless branch prediction hides it</text>
</svg>