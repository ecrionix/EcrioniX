          <rect x="100" y="250" width="520" height="40" rx="8" fill="rgba(45,212,191,.08)" stroke="#2dd4bf"/>
          <text x="360" y="275" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Assert: rst_n↓ → both FFs clear instantly. Deassert: rst_n↑ → 2 clk cycles until rst_sync_n↑</text>
        </svg>