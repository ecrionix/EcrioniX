          <text x="40" y="100" fill="#f87171" font-size="11" font-family="Outfit,sans-serif">rst_n</text>
          <text x="40" y="120" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">(async in)</text>
          <line x1="80" y1="95" x2="130" y2="95" stroke="#f87171" marker-end="url(#arr56a)"/>
          <line x1="80" y1="95" x2="80" y2="220" stroke="#f87171" stroke-dasharray="3 3"/>
          <line x1="80" y1="220" x2="130" y2="220" stroke="#f87171" marker-end="url(#arr56a)"/>
          <rect x="130" y="70" width="100" height="55" rx="8" fill="#0c1526" stroke="#38bdf8"/>
          <text x="180" y="95" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">FF1</text>
          <text x="180" y="115" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">async clr</text>
          <line x1="230" y1="97" x2="290" y2="97" stroke="#94a3b8" marker-end="url(#arr56a)"/>
          <rect x="290" y="70" width="100" height="55" rx="8" fill="#0c1526" stroke="#38bdf8"/>
          <text x="340" y="95" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">FF2</text>
          <text x="340" y="115" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">async clr</text>
          <line x1="390" y1="97" x2="450" y2="97" stroke="#2dd4bf" marker-end="url(#arr56a)"/>
          <text x="480" y="100" fill="#2dd4bf" font-size="12" font-family="Outfit,sans-serif">rst_sync_n</text>
          <text x="480" y="118" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">to local logic</text>
          <text x="40" y="200" fill="#a78bfa" font-size="11" font-family="Outfit,sans-serif">clk</text>
          <line x1="80" y1="197" x2="180" y2="125" stroke="#a78bfa" marker-end="url(#arr56a)"/>
