<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="4-bit SIPO shift register">
          <defs><marker id="arr53a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker></defs>
          <text x="350" y="24" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">4-bit SIPO — serial in, parallel out</text>
          <text x="40" y="90" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">sin</text>
          <line x1="55" y1="87" x2="95" y2="87" stroke="#38bdf8" marker-end="url(#arr53a)"/>
          <rect x="95" y="65" width="55" height="45" rx="6" fill="#0c1526" stroke="#38bdf8"/>
          <text x="122" y="92" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">FF0</text>
          <line x1="150" y1="87" x2="185" y2="87" stroke="#94a3b8" marker-end="url(#arr53a)"/>
          <rect x="185" y="65" width="55" height="45" rx="6" fill="#0c1526" stroke="#38bdf8"/>
          <text x="212" y="92" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">FF1</text>
          <line x1="240" y1="87" x2="275" y2="87" stroke="#94a3b8" marker-end="url(#arr53a)"/>
          <rect x="275" y="65" width="55" height="45" rx="6" fill="#0c1526" stroke="#38bdf8"/>
          <text x="302" y="92" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">FF2</text>
          <line x1="330" y1="87" x2="365" y2="87" stroke="#94a3b8" marker-end="url(#arr53a)"/>
          <rect x="365" y="65" width="55" height="45" rx="6" fill="#0c1526" stroke="#38bdf8"/>
          <text x="392" y="92" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">FF3</text>
          <line x1="122" y1="110" x2="122" y2="155" stroke="#2dd4bf" marker-end="url(#arr53a)"/>
          <line x1="212" y1="110" x2="212" y2="155" stroke="#2dd4bf" marker-end="url(#arr53a)"/>
          <line x1="302" y1="110" x2="302" y2="155" stroke="#2dd4bf" marker-end="url(#arr53a)"/>
          <line x1="392" y1="110" x2="392" y2="155" stroke="#2dd4bf" marker-end="url(#arr53a)"/>
          <rect x="80" y="155" width="340" height="40" rx="8" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
          <text x="250" y="180" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">parallel_out[3:0] — read full word after WIDTH shifts</text>
          <text x="500" y="90" fill="#a78bfa" font-size="11" font-family="Outfit,sans-serif">clk → all FFs</text>
<line x1="500" y1="95" x2="122" y2="55" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="3,2"/>
<line x1="500" y1="95" x2="392" y2="55" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="3,2"/>
          <text x="350" y="225" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">MSB on left; each edge shifts sin into FF0, bits propagate right</text>
        </svg>