<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skid buffer internal structure">
<defs>
<marker id="m71-sk-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker>
<marker id="m71-sk-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/></marker>
<marker id="m71-sk-rd" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#38bdf8"/></marker>
</defs>
<text x="350" y="24" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">skid_buffer — 1-deep elastic stage</text>
<rect x="30" y="80" width="90" height="60" rx="8" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/>
<text x="75" y="108" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Upstream</text>
<text x="75" y="124" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">s_valid,data</text>
<rect x="160" y="55" width="380" height="190" rx="12" fill="#0c1526" stroke="#a78bfa"/>
<text x="350" y="82" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Elastic control + 2 registers</text>
<rect x="190" y="100" width="130" height="55" rx="8" fill="#0c1526" stroke="#2dd4bf"/>
<text x="255" y="122" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">main_reg</text>
<text x="255" y="140" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">m_valid, m_data</text>
<rect x="360" y="100" width="130" height="55" rx="8" fill="#0c1526" stroke="#38bdf8"/>
<text x="425" y="122" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">skid_reg</text>
<text x="425" y="140" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">overflow slot</text>
<rect x="240" y="175" width="220" height="45" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="350" y="198" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">s_ready = space available (registered)</text>
<text x="350" y="212" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">no combo path s_valid → s_ready</text>
<rect x="580" y="80" width="90" height="60" rx="8" fill="rgba(45,212,191,.1)" stroke="#2dd4bf"/>
<text x="625" y="108" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Downstream</text>
<text x="625" y="124" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">m_ready</text>
<line x1="120" y1="100" x2="160" y2="100" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m71-sk-arr)"/>
<line x1="160" y1="120" x2="120" y2="120" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m71-sk-rd)"/>
<text x="140" y="92" fill="#38bdf8" font-size="8" font-family="Outfit,sans-serif">in</text>
<text x="140" y="134" fill="#38bdf8" font-size="8" font-family="Outfit,sans-serif">s_ready</text>
<line x1="540" y1="110" x2="580" y2="110" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m71-sk-teal)"/>
<line x1="580" y1="130" x2="540" y2="130" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m71-sk-rd)"/>
<text x="560" y="102" fill="#2dd4bf" font-size="8" font-family="Outfit,sans-serif">out</text>
<text x="560" y="144" fill="#2dd4bf" font-size="8" font-family="Outfit,sans-serif">m_ready</text>
