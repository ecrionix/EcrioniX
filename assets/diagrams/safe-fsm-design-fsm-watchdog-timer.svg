<svg viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FSM watchdog timer">
<text x="240" y="22" fill="#f87171" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Watchdog — force IDLE if stuck &gt; TIMEOUT cycles</text>
<rect x="40" y="50" width="120" height="60" rx="8" fill="#0c1526" stroke="#38bdf8"/><text x="100" y="82" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">FSM</text>
<rect x="200" y="50" width="120" height="60" rx="8" fill="rgba(248,113,113,.12)" stroke="#f87171"/><text x="260" y="75" fill="#f87171" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">watchdog ctr</text><text x="260" y="92" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">++ each cycle in !IDLE</text>
<rect x="340" y="50" width="100" height="60" rx="8" fill="#0c1526" stroke="#2dd4bf"/><text x="390" y="82" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">force IDLE</text>
<line x1="160" y1="80" x2="200" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="320" y1="80" x2="340" y2="80" stroke="#f87171" stroke-width="1.5"/>
<text x="240" y="135" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Reset ctr when state==IDLE; pulse force_idle when ctr &gt;= TIMEOUT</text>
</svg>