<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipelined ALU multiplier block diagram">
<defs>
<marker id="m85-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker>
<marker id="m85-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/></marker>
<marker id="m85-rd" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#38bdf8"/></marker>
</defs>
<text x="350" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">pipe_alu_mul — 3-stage valid-ready pipeline</text>
<rect x="20" y="55" width="90" height="50" rx="8" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
<text x="65" y="78" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Host</text>
<text x="65" y="94" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">s_valid,a,b,op</text>
<rect x="130" y="40" width="440" height="170" rx="12" fill="#0c1526" stroke="#a78bfa"/>
<text x="350" y="62" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">3-stage pipeline</text>
<rect x="150" y="80" width="100" height="50" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="200" y="100" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">S1: Latch</text><text x="200" y="118" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">capture a,b,op</text>
<rect x="268" y="92" width="16" height="26" rx="2" fill="#0c1526" stroke="#fbbf24"/><text x="276" y="108" fill="#fbbf24" font-size="6" text-anchor="middle" font-family="monospace">S1/2</text>
<rect x="296" y="80" width="100" height="50" rx="6" fill="#0c1526" stroke="#a78bfa"/><text x="346" y="100" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">S2: Partial</text><text x="346" y="118" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">mul low 16b</text>
<rect x="414" y="92" width="16" height="26" rx="2" fill="#0c1526" stroke="#fbbf24"/><text x="422" y="108" fill="#fbbf24" font-size="6" text-anchor="middle" font-family="monospace">S2/3</text>
<rect x="442" y="80" width="100" height="50" rx="6" fill="#0c1526" stroke="#2dd4bf"/><text x="492" y="100" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">S3: Finish</text><text x="492" y="118" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">add/shift out</text>
<text x="350" y="155" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">stall freezes all regs · flush clears S1/S2</text>
<rect x="590" y="55" width="90" height="50" rx="8" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="635" y="78" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Host</text>
<text x="635" y="94" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">m_valid,result</text>
<line x1="110" y1="72" x2="150" y2="95" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m85-arr)"/>
<line x1="150" y1="115" x2="110" y2="95" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m85-rd)"/>
<text x="125" y="108" fill="#38bdf8" font-size="7" font-family="Outfit,sans-serif">s_ready</text>
<line x1="542" y1="95" x2="590" y2="72" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m85-teal)"/>
<line x1="590" y1="95" x2="542" y2="115" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m85-rd)"/>
<text x="565" y="108" fill="#2dd4bf" font-size="7" font-family="Outfit,sans-serif">m_ready</text>
<text x="350" y="195" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Latency = 3 cycles · Throughput = 1 result/cycle (steady state)</text>
</svg>