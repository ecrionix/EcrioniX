<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QoR loop flowchart">
<defs>
<marker id="m912-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker>
<marker id="m912-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/></marker>
</defs>
<text x="350" y="24" fill="#38bdf8" font-size="14" text-anchor="middle" font-family="Outfit,sans-serif">QoR loop — iterate until milestone bar is met</text>
<rect x="275" y="45" width="150" height="44" rx="10" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/>
<text x="350" y="65" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">1. Write RTL</text>
<text x="350" y="80" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">spec → verilog</text>
<rect x="275" y="110" width="150" height="44" rx="10" fill="#0c1526" stroke="#a78bfa"/>
<text x="350" y="130" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">2. Lint / CDC</text>
<text x="350" y="145" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">style, X-prop, crossings</text>
<rect x="275" y="175" width="150" height="44" rx="10" fill="#0c1526" stroke="#2dd4bf"/>
<text x="350" y="195" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">3. Simulate</text>
<text x="350" y="210" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">directed + self-checking TB</text>
<rect x="275" y="240" width="150" height="44" rx="10" fill="#0c1526" stroke="#fbbf24"/>
<text x="350" y="260" fill="#fbbf24" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">4. Synthesize</text>
<text x="350" y="275" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">timing + area reports</text>
<rect x="275" y="305" width="150" height="44" rx="10" fill="rgba(248,113,113,.12)" stroke="#f87171"/>
<text x="350" y="325" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">5. Rewrite RTL</text>
<text x="350" y="340" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">pipeline, fix CDC, share ALU</text>
<line x1="350" y1="89" x2="350" y2="110" stroke="#38bdf8" stroke-width="2" marker-end="url(#m912-arr)"/>
<line x1="350" y1="154" x2="350" y2="175" stroke="#a78bfa" stroke-width="2" marker-end="url(#m912-arr)"/>
<line x1="350" y1="219" x2="350" y2="240" stroke="#2dd4bf" stroke-width="2" marker-end="url(#m912-arr)"/>
<line x1="350" y1="284" x2="350" y2="305" stroke="#fbbf24" stroke-width="2" marker-end="url(#m912-arr)"/>
<path d="M425,327 C520,327 560,200 560,67 L425,67" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#m912-arr)"/>
<line x1="425" y1="67" x2="350" y2="67" stroke="#f87171" stroke-width="2" marker-end="url(#m912-arr)"/>
<text x="590" y="200" fill="#f87171" font-size="9" font-family="Outfit,sans-serif" transform="rotate(90 590 200)">loop until QoR met</text>
<rect x="50" y="175" width="130" height="90" rx="8" fill="#0c1526" stroke="#2dd4bf"/>
<text x="115" y="200" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Exit criteria</text>
<text x="115" y="218" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">lint clean*</text>
<text x="115" y="232" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">sim pass</text>
<text x="115" y="246" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">timing met @ target</text>
<line x1="180" y1="220" x2="275" y2="197" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m912-teal)"/>
<text x="115" y="175" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">*waivers documented</text>
</svg>