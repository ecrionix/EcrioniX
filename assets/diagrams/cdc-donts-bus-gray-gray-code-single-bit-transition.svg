<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gray code single bit transition">
<defs><marker id="m97-gray-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/></marker></defs>
<text x="300" y="22" fill="#2dd4bf" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Gray increment — only one bit flips per step</text>
<text x="80" y="70" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">0111</text>
<text x="200" y="70" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="monospace">0100</text>
<text x="320" y="70" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">1100</text>
<text x="440" y="70" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">1000</text>
<line x1="110" y1="70" x2="180" y2="70" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m97-gray-arr)"/>
<line x1="230" y1="70" x2="300" y2="70" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m97-gray-arr)"/>
<line x1="350" y1="70" x2="420" y2="70" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m97-gray-arr)"/>
<text x="145" y="55" fill="#f87171" font-size="7" text-anchor="middle" font-family="monospace">bit2</text>
<text x="260" y="55" fill="#f87171" font-size="7" text-anchor="middle" font-family="monospace">bit3</text>
<text x="385" y="55" fill="#f87171" font-size="7" text-anchor="middle" font-family="monospace">bit2</text>
<text x="300" y="120" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Receiver sampling mid-transition sees valid old OR valid new — never 1111</text>
<text x="300" y="155" fill="#f87171" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Binary 0111→1000 flips 4 bits — max tearing risk</text>
</svg>