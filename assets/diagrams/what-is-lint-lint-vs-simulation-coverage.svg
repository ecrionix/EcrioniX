<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lint vs simulation coverage">
<defs><marker id="m91-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker><marker id="m91-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/></marker></defs>
<text x="340" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Two lenses on the same RTL</text>
<rect x="30" y="50" width="280" height="150" rx="12" fill="#0c1526" stroke="#a78bfa"/>
<text x="170" y="78" fill="#a78bfa" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Simulation (dynamic)</text>
<text x="170" y="105" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Stimulus-driven · time-based</text>
<text x="170" y="125" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Finds logic bugs you thought to test</text>
<text x="170" y="145" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Misses untested corners &amp; structure</text>
<text x="170" y="175" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="monospace">UVM · directed · formal props</text>
<rect x="370" y="50" width="280" height="150" rx="12" fill="#0c1526" stroke="#38bdf8"/>
<text x="510" y="78" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Static lint</text>
<text x="510" y="105" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Exhaustive structural scan</text>
<text x="510" y="125" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Finds patterns sim rarely hits</text>
<text x="510" y="145" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">No stimulus required</text>
<text x="510" y="175" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="monospace">SpyGlass · VC Lint · Verilator -Wall</text>
<rect x="250" y="215" width="180" height="22" rx="6" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="340" y="230" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Signoff needs both</text>
</svg>