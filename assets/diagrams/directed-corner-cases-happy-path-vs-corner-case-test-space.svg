<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Happy path vs corner case test space">
<text x="340" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Test space — bugs cluster at boundaries</text>
<rect x="40" y="50" width="600" height="160" rx="12" fill="#0c1526" stroke="#334155"/>
<ellipse cx="340" cy="130" rx="120" ry="60" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-dasharray="4 2"/>
<text x="340" y="125" fill="#4ade80" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Happy path</text>
<text x="340" y="142" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">normal reset, steady clk, valid data</text>
<circle cx="80" cy="70" r="28" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="80" y="74" fill="#f87171" font-size="7" text-anchor="middle" font-family="Outfit,sans-serif">Reset</text><text x="80" y="84" fill="#f87171" font-size="6" text-anchor="middle" font-family="monospace">mid-xfer</text>
<circle cx="600" cy="70" r="28" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="600" y="74" fill="#f87171" font-size="7" text-anchor="middle" font-family="Outfit,sans-serif">Back-</text><text x="600" y="84" fill="#f87171" font-size="6" text-anchor="middle" font-family="monospace">pressure</text>
<circle cx="80" cy="190" r="28" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="80" y="194" fill="#f87171" font-size="7" text-anchor="middle" font-family="Outfit,sans-serif">Overflow</text><text x="80" y="204" fill="#f87171" font-size="6" text-anchor="middle" font-family="monospace">/ wrap</text>
<circle cx="600" cy="190" r="28" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="600" y="194" fill="#f87171" font-size="7" text-anchor="middle" font-family="Outfit,sans-serif">Illegal</text><text x="600" y="204" fill="#f87171" font-size="6" text-anchor="middle" font-family="monospace">opcode</text>
<text x="340" y="218" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Directed tests aim at each red circle — not just the green center</text>
</svg>