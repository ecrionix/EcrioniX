<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Async vs sync reset timing">
          <text x="175" y="24" fill="#f87171" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Async reset assert</text>
          <text x="525" y="24" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Sync reset deassert</text>
          <text x="30" y="60" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">rst_n</text>
          <polyline points="60,55 120,55 120,95 200,95 200,55 400,55" fill="none" stroke="#f87171" stroke-width="2"/>
          <text x="30" y="110" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">clk</text>
          <polyline points="60,105 100,105 100,125 140,125 140,105 180,105 180,125 220,125 220,105 260,105 260,125 300,125 300,105 340,105 340,125 380,125 380,105 420,105" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
          <text x="30" y="160" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">q</text>
          <polyline points="60,155 120,155 120,175 200,175 200,155 400,155" fill="none" stroke="#2dd4bf" stroke-width="2"/>
          <line x1="120" y1="40" x2="120" y2="190" stroke="#f87171" stroke-dasharray="3 3"/>
          <text x="125" y="200" fill="#f87171" font-size="11" font-family="Outfit,sans-serif">assert: q clears instantly</text>
          <line x1="200" y1="40" x2="200" y2="190" stroke="#38bdf8" stroke-dasharray="3 3"/>
          <text x="205" y="230" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">deassert mid-cycle → recovery risk!</text>
          <rect x="430" y="70" width="250" height="160" rx="10" fill="#0c1526" stroke="#2dd4bf"/>
          <text x="555" y="100" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Fix: 2-FF reset synchronizer</text>
          <text x="555" y="125" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">rst_n_async → rst_sync</text>
          <text x="555" y="150" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Deassert aligned to clk</text>
          <text x="555" y="180" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Lesson 5.6 →</text>
        </svg>