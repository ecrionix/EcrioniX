<svg viewBox="0 0 660 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Critical path from flop to flop">
<defs><marker id="m98-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
<text x="330" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">One timing path: launch flop → combo cloud → capture flop</text>
<rect x="40" y="55" width="70" height="50" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="75" y="78" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">FF launch</text><text x="75" y="94" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">Q → D path</text>
<rect x="130" y="40" width="400" height="80" rx="10" fill="rgba(248,113,113,.08)" stroke="#f87171"/>
<text x="330" y="65" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Combinational logic cloud</text>
<text x="200" y="88" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">mux</text>
<text x="280" y="88" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">adder</text>
<text x="360" y="88" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">comparator</text>
<text x="440" y="88" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">wide mux</text>
<text x="330" y="108" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">delay = sum of gate delays along slowest route</text>
<rect x="550" y="55" width="70" height="50" rx="6" fill="#0c1526" stroke="#2dd4bf"/><text x="585" y="78" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">FF capture</text><text x="585" y="94" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">setup window</text>
<line x1="110" y1="80" x2="130" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#m98-arr)"/>
<line x1="530" y1="80" x2="550" y2="80" stroke="#2dd4bf" stroke-width="2" marker-end="url(#m98-arr)"/>
<rect x="130" y="140" width="400" height="28" rx="4" fill="#0c1526" stroke="#a78bfa"/>
<text x="330" y="159" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">T_clk ≥ T_launch + T_combo + T_setup − T_skew</text>
<text x="330" y="195" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Slack = required time − arrival time · negative slack = timing violation</text>
</svg>