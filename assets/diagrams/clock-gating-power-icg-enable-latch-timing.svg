<svg viewBox="0 0 580 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ICG enable latch timing">
<text x="290" y="20" fill="#a78bfa" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">ICG latches enable while clk is low — enable must be stable here</text>
<line x1="40" y1="80" x2="540" y2="80" stroke="#38bdf8" stroke-width="2"/>
<text x="40" y="70" fill="#38bdf8" font-size="8" font-family="monospace">clk</text>
<line x1="40" y1="120" x2="540" y2="120" stroke="#a78bfa" stroke-width="1.5"/>
<text x="40" y="110" fill="#a78bfa" font-size="8" font-family="monospace">enable</text>
<rect x="55" y="55" width="200" height="50" rx="4" fill="rgba(167,139,250,.1)" stroke="#a78bfa" stroke-dasharray="4,3"/>
<text x="155" y="50" fill="#a78bfa" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">latch window (clk low)</text>
<line x1="255" y1="55" x2="255" y2="105" stroke="#f87171" stroke-width="1.5"/>
<text x="255" y="145" fill="#f87171" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">enable changes here → glitch risk</text>
<rect x="320" y="55" width="180" height="50" rx="4" fill="rgba(45,212,191,.1)" stroke="#2dd4bf"/>
<text x="410" y="75" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">safe: enable stable</text>
<text x="410" y="92" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">registered one cycle early</text>
</svg>