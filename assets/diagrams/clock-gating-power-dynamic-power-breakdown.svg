<svg viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dynamic power breakdown">
<text x="320" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Typical SoC dynamic power — clock network is the biggest RTL-visible target</text>
<rect x="40" y="45" width="140" height="90" rx="8" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/>
<text x="110" y="75" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Clock tree</text>
<text x="110" y="95" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">30–50%</text>
<text x="110" y="115" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">ICG reduces this</text>
<rect x="200" y="45" width="140" height="90" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="270" y="75" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Datapath</text>
<text x="270" y="95" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">25–35%</text>
<text x="270" y="115" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">operand isolation</text>
<rect x="360" y="45" width="120" height="90" rx="8" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="420" y="75" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">I/O pads</text>
<text x="420" y="95" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">10–20%</text>
<rect x="500" y="45" width="100" height="90" rx="8" fill="rgba(251,191,36,.1)" stroke="#fbbf24"/>
<text x="550" y="75" fill="#fbbf24" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Memories</text>
<text x="550" y="95" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">sleep pins</text>
<text x="320" y="150" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Lesson 9.11 focuses on clock + combo toggle — not full UPF power domains</text>
</svg>