<svg viewBox="0 0 440 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2FF synchronizer">
<text x="220" y="16" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">2-FF synchronizer — single bit only</text>
<rect x="20" y="35" width="50" height="30" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/>
<text x="45" y="55" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">clk_a</text>
<rect x="100" y="35" width="60" height="30" rx="4" fill="#0c1526" stroke="#a78bfa"/>
<text x="130" y="55" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">FF1</text>
<rect x="190" y="35" width="60" height="30" rx="4" fill="#0c1526" stroke="#a78bfa"/>
<text x="220" y="55" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">FF2</text>
<rect x="280" y="35" width="50" height="30" rx="4" fill="rgba(45,212,191,.15)" stroke="#2dd4bf"/>
<text x="305" y="55" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">clk_b</text>
<text x="380" y="55" fill="#f87171" font-size="9" font-family="Outfit,sans-serif">✗ 32-bit</text>
<text x="380" y="70" fill="#94a3b8" font-size="8" font-family="Outfit,sans-serif">bus sync</text>
<line x1="70" y1="50" x2="100" y2="50" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="160" y1="50" x2="190" y2="50" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="250" y1="50" x2="280" y2="50" stroke="#94a3b8" stroke-width="1.5"/>
<text x="220" y="90" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">MTBF ↑ with 2 stages; bus bits can arrive in different cycles → use gray FIFO or handshake</text>
</svg>