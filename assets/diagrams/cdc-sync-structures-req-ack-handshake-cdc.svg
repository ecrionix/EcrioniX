<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Req ack handshake CDC">
<defs><marker id="m96-req" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker><marker id="m96-ack" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#2dd4bf"/></marker></defs>
<text x="300" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Req/ack CDC — data held stable until ack</text>
<rect x="40" y="50" width="200" height="130" rx="10" fill="#0c1526" stroke="#38bdf8"/>
<text x="140" y="72" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Source (clk_a)</text>
<text x="140" y="95" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">data[W-1:0] stable</text>
<text x="140" y="115" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">req → (2FF) → dst</text>
<text x="140" y="135" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">wait ack ← (2FF) ← dst</text>
<text x="140" y="160" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">FSM: IDLE→REQ→WAIT_ACK</text>
<rect x="360" y="50" width="200" height="130" rx="10" fill="#0c1526" stroke="#a78bfa"/>
<text x="460" y="72" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Dest (clk_b)</text>
<text x="460" y="95" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">sample data on req_sync</text>
<text x="460" y="115" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">assert ack → (2FF) → src</text>
<text x="460" y="135" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">deassert after req falls</text>
<text x="460" y="160" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">FSM: IDLE→SAMPLE→ACK</text>
<line x1="240" y1="100" x2="360" y2="100" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m96-req)"/>
<text x="300" y="92" fill="#38bdf8" font-size="7" text-anchor="middle" font-family="monospace">req + data</text>
<line x1="360" y1="130" x2="240" y2="130" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m96-ack)"/>
<text x="300" y="148" fill="#2dd4bf" font-size="7" text-anchor="middle" font-family="monospace">ack</text>
</svg>