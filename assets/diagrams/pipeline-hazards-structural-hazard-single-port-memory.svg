<svg viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Structural hazard single port memory">
<defs>
<marker id="m82-struct-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker>
<marker id="m82-struct-purple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/></marker>
</defs>
<text x="260" y="22" fill="#f87171" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Structural hazard — single-port SRAM</text>
<rect x="40" y="50" width="90" height="44" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="85" y="72" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">IF stage</text><text x="85" y="86" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">read instr</text>
<rect x="200" y="50" width="120" height="44" rx="6" fill="rgba(248,113,113,.12)" stroke="#f87171"/><text x="260" y="72" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">1-port MEM</text><text x="260" y="86" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">one access/cycle</text>
<rect x="390" y="50" width="90" height="44" rx="6" fill="#0c1526" stroke="#a78bfa"/><text x="435" y="72" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">MEM stage</text><text x="435" y="86" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">load data</text>
<line x1="130" y1="72" x2="200" y2="72" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m82-struct-arr)"/>
<line x1="320" y1="72" x2="390" y2="72" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m82-struct-purple)"/>
<text x="260" y="125" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Collision → stall IF or MEM, or add second read port</text>
<text x="260" y="145" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Fix: Harvard architecture (split I/D), dual-port RAM, or interleave access</text>
</svg>