<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FSM block style comparison">
<text x="350" y="20" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">FSM RTL decomposition</text>
<rect x="30" y="50" width="180" height="120" rx="10" fill="#0c1526" stroke="#f87171"/>
<text x="120" y="78" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">1-Block</text>
<text x="120" y="100" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">always @(posedge clk)</text>
<text x="120" y="118" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">state + next + outputs</text>
<text x="120" y="148" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">⚠ hard to review</text>
<rect x="260" y="50" width="180" height="120" rx="10" fill="#0c1526" stroke="#2dd4bf"/>
<text x="350" y="78" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">2-Block ★</text>
<text x="350" y="100" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">seq: state &lt;= next</text>
<text x="350" y="118" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">combo: next = f(s,in)</text>
<text x="350" y="148" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">✓ industry default</text>
<rect x="490" y="50" width="180" height="120" rx="10" fill="#0c1526" stroke="#a78bfa"/>
<text x="580" y="78" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">3-Block ★</text>
<text x="580" y="100" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">+ output decode block</text>
<text x="580" y="118" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Moore outputs separated</text>
<text x="580" y="148" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">✓ clearest Moore FSMs</text>
</svg>