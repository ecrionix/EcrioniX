          <text x="350" y="165" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Carry ripples left → right: slow for wide N</text>
          <text x="350" y="185" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Carry-lookahead / prefix trees break this chain (advanced)</text>
