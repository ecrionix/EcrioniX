<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ripple carry chain">
          <text x="20" y="34" fill="#94a3b8" font-size="10" font-family="Outfit,sans-serif">cin=0</text>
          <line x1="42" y1="30" x2="85" y2="108" stroke="#a78bfa" stroke-width="1.5"/>
          <text x="40" y="22" fill="#94a3b8" font-size="10" font-family="Outfit,sans-serif">a[0] b[0]</text>
