<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stall propagation diagram">
<defs><marker id="m83-stall" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f87171"/></marker></defs>
<text x="310" y="22" fill="#f87171" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Load-use stall — freeze IF, ID, EX; bubble into MEM</text>
<rect x="40" y="50" width="80" height="36" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="80" y="72" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">IF/ID</text>
<rect x="150" y="50" width="80" height="36" rx="6" fill="#0c1526" stroke="#a78bfa"/><text x="190" y="72" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">ID/EX</text>
<rect x="260" y="50" width="80" height="36" rx="6" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="300" y="72" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">EX/MEM</text>
<rect x="370" y="50" width="80" height="36" rx="6" fill="#0c1526" stroke="#2dd4bf"/><text x="410" y="72" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">MEM/WB</text>
<text x="80" y="100" fill="#f87171" font-size="8" text-anchor="middle" font-family="monospace">stall</text>
<text x="190" y="100" fill="#f87171" font-size="8" text-anchor="middle" font-family="monospace">stall</text>
<text x="300" y="100" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">load here</text>
<text x="410" y="100" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="monospace">advances</text>
<line x1="120" y1="68" x2="150" y2="68" stroke="#f87171" stroke-width="2" stroke-dasharray="4,3"/>
<line x1="230" y1="68" x2="260" y2="68" stroke="#f87171" stroke-width="2" stroke-dasharray="4,3"/>
<path d="M80,110 C80,125 40,125 40,68" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#m83-stall)"/>
<text x="28" y="95" fill="#f87171" font-size="7" font-family="monospace">PC</text>
<rect x="150" y="130" width="200" height="40" rx="6" fill="rgba(251,191,36,.08)" stroke="#fbbf24"/>
<text x="250" y="148" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">bubble (NOP) inserted at EX/MEM input</text>
<text x="250" y="162" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">reg_write=0, alu_op=ADD x0</text>
<text x="310" y="190" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Stall chain propagates backward; bubble prevents duplicate EX work</text>
</svg>