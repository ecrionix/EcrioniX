<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One-hot state bit transitions">
<defs><marker id="m63-oharr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
<text x="280" y="22" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">One-hot: only two bits change per transition (old off, new on)</text>
<rect x="30" y="55" width="88" height="100" rx="8" fill="#0c1526" stroke="#2dd4bf"/>
<text x="74" y="78" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">IDLE</text>
<text x="74" y="98" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="monospace">00001</text>
<rect x="130" y="55" width="88" height="100" rx="8" fill="#0c1526" stroke="#38bdf8"/>
<text x="174" y="78" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">REQ</text>
<text x="174" y="98" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="monospace">00010</text>
<rect x="230" y="55" width="88" height="100" rx="8" fill="#0c1526" stroke="#a78bfa"/>
<text x="274" y="78" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">GNT</text>
<text x="274" y="98" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="monospace">00100</text>
<rect x="330" y="55" width="88" height="100" rx="8" fill="#0c1526" stroke="#2dd4bf"/>
<text x="374" y="78" fill="#2dd4bf" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">XFER</text>
<text x="374" y="98" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="monospace">01000</text>
<rect x="430" y="55" width="88" height="100" rx="8" fill="#0c1526" stroke="#38bdf8"/>
<text x="474" y="78" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">DONE</text>
<text x="474" y="98" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="monospace">10000</text>
<path d="M118,105 L130,105" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m63-oharr)"/>
<path d="M218,105 L230,105" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m63-oharr)"/>
<path d="M318,105 L330,105" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m63-oharr)"/>
<path d="M418,105 L430,105" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m63-oharr)"/>
<path d="M474,55 C474,30 74,30 74,55" fill="none" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m63-oharr)"/>
<text x="280" y="175" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">IDLE→REQ: bit[0]↓ bit[1]↑ — only two FFs toggle</text>
<text x="280" y="210" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">DONE→IDLE wraps — same two-bit flip pattern</text>
</svg>