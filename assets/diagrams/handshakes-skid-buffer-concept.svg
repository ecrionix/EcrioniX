<svg viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skid buffer concept">
<text x="240" y="20" fill="#a78bfa" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Skid buffer — one bubble of slack</text>
