<rect x="150" y="45" width="100" height="50" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/><text x="200" y="68" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Skid (2-deep)</text>
<text x="200" y="84" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">breaks ready path</text>
