<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Module hierarchy">
          <rect x="200" y="20" width="320" height="70" rx="10" fill="rgba(167,139,250,.12)" stroke="#a78bfa" stroke-width="2"/>
          <text x="360" y="50" fill="#a78bfa" font-size="14" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="600">top_module</text>
          <text x="360" y="72" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">wires: a, b, sum, carry</text>
          <rect x="80" y="150" width="180" height="100" rx="10" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/>
          <text x="170" y="185" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">half_adder u_ha</text>
          <text x="170" y="210" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">.a(a) .b(b)</text>
          <text x="170" y="228" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">.sum(sum) .cout(c1)</text>
          <rect x="460" y="150" width="180" height="100" rx="10" fill="rgba(45,212,191,.1)" stroke="#2dd4bf"/>
          <text x="550" y="185" fill="#2dd4bf" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">half_adder u_hb</text>
          <text x="550" y="210" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">.a(c1) .b(cin)</text>
          <text x="550" y="228" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">.sum(carry) .cout()</text>
          <line x1="170" y1="120" x2="170" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
          <line x1="550" y1="120" x2="550" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
          <line x1="360" y1="90" x2="360" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
          <line x1="360" y1="120" x2="170" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
          <line x1="360" y1="120" x2="550" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
        </svg>