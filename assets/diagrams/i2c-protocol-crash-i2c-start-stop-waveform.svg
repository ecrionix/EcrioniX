<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="I2C START STOP waveform">
<text x="360" y="20" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">START, one byte + ACK, STOP</text>
<text x="50" y="55" fill="#94a3b8" font-size="9" font-family="monospace">SCL</text>
<polyline points="80,50 120,50 140,70 160,70 180,50 200,50 220,70 240,70 260,50 280,50 300,70 320,70 340,50 360,50 380,70 400,70 420,50 440,50 460,70 480,70 500,50 520,50 540,70 560,70 580,50 600,50 620,70 640,70 660,50" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="50" y="110" fill="#94a3b8" font-size="9" font-family="monospace">SDA</text>
<polyline points="80,105 100,105 100,125 140,125 160,105 180,85 200,85 220,105 240,85 260,105 280,85 300,105 320,85 340,105 360,85 380,105 400,85 420,105 440,85 460,105 480,85 500,105 520,85 540,105 560,85 580,105 600,85 620,105 640,85 660,105" fill="none" stroke="#2dd4bf" stroke-width="2"/>
