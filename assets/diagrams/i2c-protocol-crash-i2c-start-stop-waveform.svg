<rect x="130" y="160" width="420" height="28" rx="5" fill="rgba(56,189,248,.08)" stroke="rgba(56,189,248,.3)"/>
<text x="340" y="178" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Data valid while SCL is LOW; sample on SCL rising edge</text>
