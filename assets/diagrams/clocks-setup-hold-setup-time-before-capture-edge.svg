<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Setup time before capture edge">
          <rect x="40" y="24" width="90" height="50" rx="8" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="85" y="54" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">FF launch</text>
          <path d="M130 49 H180" stroke="#2dd4bf" stroke-width="2"/>
          <rect x="180" y="19" width="120" height="60" rx="8" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/><text x="240" y="49" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">combo delay</text>
