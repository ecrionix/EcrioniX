          <rect x="230" y="50" width="180" height="55" rx="8" fill="rgba(248,113,113,.12)" stroke="#f87171"/>
          <text x="320" y="72" fill="#f87171" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">always @(*) case(sel)</text>
          <text x="320" y="90" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">missing default branch</text>
