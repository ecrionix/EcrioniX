          <text x="645" y="82" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">out</text>
          <path d="M 645 105 L 645 140 L 520 140 L 520 105" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
          <text x="580" y="155" fill="#f87171" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">feedback = latch</text>
