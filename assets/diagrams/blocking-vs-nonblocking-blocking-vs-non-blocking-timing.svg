<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blocking vs non-blocking timing">
          <text x="180" y="25" fill="#f87171" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="600">Blocking (=)</text>
          <text x="540" y="25" fill="#4ade80" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="600">Non-blocking (&lt;=)</text>
          <line x1="40" y1="50" x2="320" y2="50" stroke="#94a3b8" stroke-width="1"/>
          <line x1="400" y1="50" x2="680" y2="50" stroke="#94a3b8" stroke-width="1"/>
          <text x="40" y="70" fill="#94a3b8" font-size="9" font-family="JetBrains Mono,monospace">a=1; b=a;</text>
          <rect x="40" y="80" width="60" height="25" rx="4" fill="rgba(248,113,113,.2)" stroke="#f87171"/><text x="70" y="97" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">a=1 ✓</text>
          <rect x="110" y="80" width="80" height="25" rx="4" fill="rgba(248,113,113,.2)" stroke="#f87171"/><text x="150" y="97" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">b=1 ✓ now</text>
          <text x="40" y="130" fill="#94a3b8" font-size="10" font-family="Outfit,sans-serif">Each line completes before next runs</text>
          <text x="400" y="70" fill="#94a3b8" font-size="9" font-family="JetBrains Mono,monospace">a&lt;=1; b&lt;=a;</text>
          <rect x="400" y="80" width="100" height="25" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="450" y="97" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">sample a (old)</text>
          <rect x="510" y="80" width="100" height="25" rx="4" fill="rgba(56,189,248,.15)" stroke="#38bdf8"/><text x="560" y="97" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">schedule updates</text>
          <rect x="400" y="120" width="210" height="25" rx="4" fill="rgba(74,222,128,.15)" stroke="#4ade80"/><text x="505" y="137" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">NBA region: a=1, b=old_a applied together</text>
          <text x="400" y="170" fill="#94a3b8" font-size="10" font-family="Outfit,sans-serif">All RHS read first, then all LHS update at once</text>
          <rect x="100" y="200" width="520" height="60" rx="8" fill="rgba(251,191,36,.08)" stroke="#fbbf24"/>
          <text x="360" y="225" fill="#fbbf24" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="600">Hardware model: non-blocking = parallel register updates on clock edge</text>
          <text x="360" y="245" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Blocking in clocked logic = serial execution that doesn't exist in real flops</text>
        </svg>