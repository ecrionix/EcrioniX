<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Non-pipelined vs pipelined datapath">
<defs>
<marker id="m81-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker>
<marker id="m81-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/></marker>
</defs>
<text x="350" y="22" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Before: single multi-cycle blob · After: staged with pipeline registers</text>
<text x="120" y="48" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Non-pipelined</text>
<rect x="30" y="58" width="70" height="44" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="65" y="85" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">IN</text>
<rect x="110" y="58" width="90" height="44" rx="6" fill="rgba(248,113,113,.1)" stroke="#f87171"/><text x="155" y="78" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Fetch+Decode</text><text x="155" y="92" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">combo</text>
<rect x="210" y="58" width="70" height="44" rx="6" fill="rgba(248,113,113,.1)" stroke="#f87171"/><text x="245" y="85" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Execute</text>
<rect x="290" y="58" width="70" height="44" rx="6" fill="rgba(248,113,113,.1)" stroke="#f87171"/><text x="325" y="85" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Writeback</text>
<rect x="370" y="58" width="50" height="44" rx="6" fill="#0c1526" stroke="#2dd4bf"/><text x="395" y="85" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">OUT</text>
<line x1="100" y1="80" x2="110" y2="80" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m81-arr)"/>
<line x1="200" y1="80" x2="210" y2="80" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m81-arr)"/>
<line x1="280" y1="80" x2="290" y2="80" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m81-arr)"/>
<line x1="360" y1="80" x2="370" y2="80" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m81-arr)"/>
<text x="220" y="118" fill="#f87171" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">One op blocks the path for N cycles</text>
<text x="120" y="148" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Pipelined</text>
<rect x="30" y="158" width="70" height="44" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="65" y="185" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">IN</text>
<rect x="110" y="158" width="80" height="44" rx="6" fill="#0c1526" stroke="#a78bfa"/><text x="150" y="178" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">IF</text><text x="150" y="192" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">stage</text>
<rect x="200" y="168" width="14" height="24" rx="2" fill="#0c1526" stroke="#fbbf24" stroke-width="1.5"/><text x="207" y="184" fill="#fbbf24" font-size="7" text-anchor="middle" font-family="monospace">IF/ID</text>
<rect x="224" y="158" width="80" height="44" rx="6" fill="#0c1526" stroke="#a78bfa"/><text x="264" y="185" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">ID</text>
<rect x="314" y="168" width="14" height="24" rx="2" fill="#0c1526" stroke="#fbbf24" stroke-width="1.5"/><text x="321" y="184" fill="#fbbf24" font-size="7" text-anchor="middle" font-family="monospace">ID/EX</text>
<rect x="338" y="158" width="80" height="44" rx="6" fill="#0c1526" stroke="#a78bfa"/><text x="378" y="185" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">EX</text>
<rect x="428" y="168" width="14" height="24" rx="2" fill="#0c1526" stroke="#fbbf24" stroke-width="1.5"/><text x="435" y="184" fill="#fbbf24" font-size="7" text-anchor="middle" font-family="monospace">EX/WB</text>
<rect x="452" y="158" width="80" height="44" rx="6" fill="#0c1526" stroke="#a78bfa"/><text x="492" y="185" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">WB</text>
<rect x="542" y="158" width="50" height="44" rx="6" fill="#0c1526" stroke="#2dd4bf"/><text x="567" y="185" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">OUT</text>
<line x1="100" y1="180" x2="110" y2="180" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m81-teal)"/>
<line x1="190" y1="180" x2="200" y2="180" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m81-teal)"/>
<line x1="214" y1="180" x2="224" y2="180" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m81-teal)"/>
<line x1="304" y1="180" x2="314" y2="180" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m81-teal)"/>
<line x1="328" y1="180" x2="338" y2="180" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m81-teal)"/>
<line x1="418" y1="180" x2="428" y2="180" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m81-teal)"/>
<line x1="442" y1="180" x2="452" y2="180" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m81-teal)"/>
<line x1="532" y1="180" x2="542" y2="180" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m81-teal)"/>
<text x="350" y="228" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Yellow blocks = pipeline registers (break timing paths)</text>
<text x="350" y="268" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Steady state: IF, ID, EX, WB all active on different instructions simultaneously</text>
</svg>