<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Regfile read mux structure">
<defs><marker id="m910-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
<text x="310" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Register file — storage is cheap; read mux is the area tax</text>
<rect x="40" y="50" width="80" height="120" rx="6" fill="#0c1526" stroke="#a78bfa"/>
<text x="80" y="75" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">32×32</text>
<text x="80" y="95" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">reg array</text>
<text x="80" y="115" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">N×W flops</text>
<rect x="180" y="70" width="100" height="80" rx="6" fill="rgba(248,113,113,.12)" stroke="#f87171"/>
<text x="230" y="95" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">32:1 mux</text>
<text x="230" y="115" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">per read port</text>
<rect x="320" y="85" width="80" height="50" rx="6" fill="#0c1526" stroke="#2dd4bf"/>
<text x="360" y="115" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">rd_data</text>
