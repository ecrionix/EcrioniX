<line x1="120" y1="110" x2="180" y2="110" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m910-arr)"/>
<line x1="120" y1="130" x2="180" y2="125" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m910-arr)"/>
<line x1="280" y1="110" x2="320" y2="110" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m910-arr)"/>
<text x="150" y="85" fill="#94a3b8" font-size="7" font-family="monospace">rd_addr</text>
<text x="500" y="95" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Dual-port = 2× mux cost</text>
<text x="500" y="115" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">Banked regfile reduces mux width</text>
