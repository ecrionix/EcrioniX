<rect x="220" y="50" width="100" height="36" rx="6" fill="rgba(248,113,113,.15)" stroke="#f87171"/><text x="270" y="68" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">ADD in EX</text><text x="270" y="82" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">needs load data</text>
