<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Self-checking testbench block diagram">
<defs><marker id="m101-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker><marker id="m101-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/></marker></defs>
<text x="350" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Self-checking testbench — three cooperating blocks</text>
<rect x="30" y="60" width="140" height="90" rx="10" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
<text x="100" y="90" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Stimulus</text>
<text x="100" y="108" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">clk, rst_n</text>
<text x="100" y="122" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">drive a,b,en</text>
<text x="100" y="136" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">tasks / initial</text>
<rect x="260" y="55" width="180" height="100" rx="10" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="350" y="90" fill="#a78bfa" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">DUT</text>
<text x="350" y="110" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">acc_8bit</text>
<text x="350" y="128" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">design under test</text>
<rect x="530" y="60" width="140" height="90" rx="10" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="600" y="90" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Checker</text>
<text x="600" y="108" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">if (sum !== exp)</text>
<text x="600" y="122" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">errors++</text>
<text x="600" y="136" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">$display PASS/FAIL</text>
<line x1="170" y1="105" x2="260" y2="105" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m101-arr)"/>
<text x="215" y="98" fill="#38bdf8" font-size="7" text-anchor="middle" font-family="monospace">inputs</text>
<line x1="440" y1="105" x2="530" y2="105" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m101-teal)"/>
<text x="485" y="98" fill="#2dd4bf" font-size="7" text-anchor="middle" font-family="monospace">outputs</text>
<rect x="200" y="175" width="300" height="28" rx="6" fill="rgba(251,191,36,.1)" stroke="#fbbf24"/>
<text x="350" y="194" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Scoreboard: expected value computed in TB, not stored in DUT</text>
</svg>