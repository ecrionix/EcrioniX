<svg viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Binary vs one-hot decode fan-in">
<text x="140" y="22" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Binary — wide decoder</text>
<text x="420" y="22" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">One-hot — local per-bit logic</text>
<rect x="20" y="45" width="70" height="40" rx="6" fill="#0c1526" stroke="#38bdf8"/><text x="45" y="70" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="monospace">state[2:0]</text>
<rect x="110" y="40" width="100" height="50" rx="6" fill="rgba(248,113,113,.12)" stroke="#f87171"/><text x="160" y="70" fill="#f87171" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">3→8 decode</text>
<rect x="210" y="40" width="80" height="50" rx="6" fill="#0c1526" stroke="#94a3b8"/><text x="250" y="70" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">next logic</text>
<text x="160" y="115" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">All inputs fan into one cone</text>
<rect x="320" y="45" width="200" height="40" rx="6" fill="#0c1526" stroke="#2dd4bf"/><text x="420" y="70" fill="#e2e8f0" font-size="9" text-anchor="middle" font-family="monospace">state[4:0] one-hot</text>
<rect x="340" y="100" width="50" height="35" rx="4" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/><text x="365" y="122" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">bit0</text>
<rect x="400" y="100" width="50" height="35" rx="4" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/><text x="425" y="122" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">bit1</text>
<rect x="460" y="100" width="50" height="35" rx="4" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/><text x="485" y="122" fill="#2dd4bf" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">…</text>
<text x="420" y="165" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">Each bit: shallow AND-OR — parallel cones</text>
<line x1="90" y1="65" x2="110" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="190" y1="65" x2="210" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="370" y1="85" x2="365" y2="100" stroke="#2dd4bf" stroke-width="1.2"/>
<line x1="420" y1="85" x2="425" y2="100" stroke="#2dd4bf" stroke-width="1.2"/>
<line x1="470" y1="85" x2="485" y2="100" stroke="#2dd4bf" stroke-width="1.2"/>
</svg>