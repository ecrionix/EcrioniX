<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SoC block diagram with I2C">
        <rect x="10" y="10" width="740" height="300" rx="14" fill="#0c1526" stroke="rgba(148,163,184,.25)"/>
        <text x="30" y="38" fill="#94a3b8" font-size="12" font-family="Outfit,sans-serif">clk_sys domain</text>
        <rect x="40" y="55" width="140" height="70" rx="10" fill="rgba(56,189,248,.1)" stroke="#38bdf8"/>
        <text x="110" y="95" fill="#e2e8f0" font-size="14" text-anchor="middle" font-family="Outfit,sans-serif">CPU / Host</text>
        <rect x="220" y="55" width="160" height="70" rx="10" fill="rgba(45,212,191,.1)" stroke="#2dd4bf"/>
        <text x="300" y="88" fill="#e2e8f0" font-size="14" text-anchor="middle" font-family="Outfit,sans-serif">CSR / Reg map</text>
        <text x="300" y="108" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">APB / AXI-lite</text>
        <rect x="420" y="45" width="300" height="200" rx="12" fill="rgba(167,139,250,.08)" stroke="#a78bfa"/>
        <text x="570" y="70" fill="#a78bfa" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">I2C Master IP</text>
        <rect x="445" y="90" width="110" height="50" rx="8" fill="#0c1526" stroke="#94a3b8"/>
        <text x="500" y="120" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Byte FSM</text>
        <rect x="585" y="90" width="110" height="50" rx="8" fill="#0c1526" stroke="#94a3b8"/>
        <text x="640" y="120" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">Bit engine</text>
        <rect x="445" y="160" width="250" height="55" rx="8" fill="#0c1526" stroke="#fbbf24"/>
        <text x="570" y="185" fill="#fbbf24" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">SCL / SDA open-drain pads</text>
        <text x="570" y="205" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">board I2C bus</text>
        <line x1="180" y1="90" x2="220" y2="90" stroke="#38bdf8" stroke-width="2"/>
        <line x1="380" y1="90" x2="420" y2="90" stroke="#2dd4bf" stroke-width="2"/>
        <rect x="40" y="160" width="140" height="70" rx="10" fill="rgba(248,113,113,.08)" stroke="#f87171"/>
        <text x="110" y="192" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Always-on</text>
        <text x="110" y="210" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">wake / RTC</text>
        <text x="40" y="280" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">Tip: label every arrow with protocol + clock domain</text>
      </svg>