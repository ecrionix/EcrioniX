<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="I2C master three-layer block diagram">
<defs><marker id="m114-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker><marker id="m114-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/></marker></defs>
<text x="360" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">i2c_master_top — CSR → byte FSM → bit engine → pads</text>
<rect x="20" y="50" width="130" height="90" rx="10" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
<text x="85" y="80" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">APB / SW</text>
<text x="85" y="98" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">paddr, pwdata</text>
<text x="85" y="112" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">prdata, pwrite</text>
<rect x="180" y="40" width="160" height="110" rx="10" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/>
<text x="260" y="72" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">CSR decode</text>
<text x="260" y="90" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">CTRL START/ABORT</text>
<text x="260" y="104" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">STAT BUSY/NACK/DONE</text>
<text x="260" y="118" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">ADDR TXDATA RXDATA</text>
<rect x="370" y="40" width="160" height="110" rx="10" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
<text x="450" y="72" fill="#2dd4bf" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Byte FSM</text>
<text x="450" y="90" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">IDLE → START</text>
<text x="450" y="104" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">→ 8 bits → ACK</text>
<text x="450" y="118" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">→ STOP → DONE</text>
<rect x="560" y="40" width="140" height="110" rx="10" fill="rgba(251,191,36,.1)" stroke="#fbbf24"/>
<text x="630" y="72" fill="#fbbf24" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Bit engine</text>
<text x="630" y="90" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">scl_oe, sda_oe</text>
<text x="630" y="104" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">half-period cnt</text>
<text x="630" y="118" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">sample SDA @ ACK</text>
<line x1="150" y1="95" x2="180" y2="95" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m114-arr)"/>
<line x1="340" y1="95" x2="370" y2="95" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#m114-teal)"/>
<line x1="530" y1="95" x2="560" y2="95" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#m114-arr)"/>
<rect x="560" y="200" width="140" height="50" rx="8" fill="#0c1526" stroke="#94a3b8"/>
<text x="630" y="230" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">I2C pads</text>
<line x1="630" y1="150" x2="630" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m114-arr)"/>
<text x="360" y="175" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">bit_cmd: drive_bit / sample_ack / gen_start / gen_stop</text>
<rect x="180" y="200" width="350" height="70" rx="8" fill="rgba(56,189,248,.06)" stroke="rgba(56,189,248,.25)"/>
<text x="355" y="228" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Handshake: byte FSM issues one bit command at a time</text>
<text x="355" y="248" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">bit_done pulse advances byte FSM · ack_sda sampled on 9th bit</text>
</svg>