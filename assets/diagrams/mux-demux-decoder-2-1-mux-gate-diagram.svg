<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2:1 mux gate diagram">
          <text x="30" y="50" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">a</text>
          <line x1="50" y1="50" x2="120" y2="50" stroke="#38bdf8"/>
          <text x="30" y="100" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">b</text>
          <line x1="50" y1="100" x2="120" y2="100" stroke="#38bdf8"/>
          <text x="30" y="150" fill="#94a3b8" font-size="11" font-family="Outfit,sans-serif">sel</text>
          <line x1="50" y1="150" x2="120" y2="150" stroke="#a78bfa"/>
          <line x1="120" y1="150" x2="120" y2="70" stroke="#a78bfa"/>
          <line x1="120" y1="150" x2="120" y2="120" stroke="#a78bfa"/>
          <rect x="120" y="30" width="80" height="40" rx="6" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
          <text x="160" y="55" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">AND</text>
          <rect x="120" y="80" width="80" height="40" rx="6" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/>
          <text x="160" y="105" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">AND</text>
          <line x1="200" y1="50" x2="280" y2="70" stroke="#38bdf8"/>
          <line x1="200" y1="100" x2="280" y2="90" stroke="#38bdf8"/>
          <rect x="280" y="60" width="80" height="40" rx="6" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/>
          <text x="320" y="85" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">OR</text>
          <line x1="360" y1="80" x2="420" y2="80" stroke="#2dd4bf"/>
          <text x="430" y="85" fill="#e2e8f0" font-size="12" font-family="Outfit,sans-serif">y</text>
          <text x="160" y="185" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Outfit,sans-serif">Classic AND-OR mux structure</text>
        </svg>