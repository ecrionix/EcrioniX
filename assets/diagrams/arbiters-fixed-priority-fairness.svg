<svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fixed priority fairness">
<text x="260" y="20" fill="#f87171" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">Fixed priority — M0 starves M2 when always requesting</text>
<text x="50" y="50" fill="#94a3b8" font-size="9" font-family="Outfit,sans-serif">cycle</text>
<text x="50" y="70" fill="#94a3b8" font-size="9" font-family="Outfit,sans-serif">M0 req</text>
<text x="50" y="90" fill="#94a3b8" font-size="9" font-family="Outfit,sans-serif">M1 req</text>
<text x="50" y="110" fill="#94a3b8" font-size="9" font-family="Outfit,sans-serif">M2 req</text>
<text x="50" y="130" fill="#38bdf8" font-size="9" font-family="Outfit,sans-serif">grant</text>
<text x="120" y="70" fill="#38bdf8" font-size="9" font-family="monospace">1 1 1 1</text>
<text x="180" y="70" fill="#a78bfa" font-size="9" font-family="monospace">1 0 0 0</text>
<text x="240" y="70" fill="#a78bfa" font-size="9" font-family="monospace">1 0 0 0</text>
<text x="300" y="70" fill="#a78bfa" font-size="9" font-family="monospace">1 0 0 0</text>
<text x="120" y="90" fill="#2dd4bf" font-size="9" font-family="monospace">0 1 1 1</text>
<text x="120" y="110" fill="#2dd4bf" font-size="9" font-family="monospace">0 1 1 1</text>
<text x="120" y="130" fill="#38bdf8" font-size="9" font-family="monospace">G0 G0 G0 G0</text>
<text x="180" y="130" fill="#94a3b8" font-size="9" font-family="monospace">.  .  .  .</text>
<text x="240" y="130" fill="#94a3b8" font-size="9" font-family="monospace">.  .  .  .</text>
<text x="360" y="110" fill="#f87171" font-size="9" font-family="Outfit,sans-serif">M2 never granted</text>
</svg>