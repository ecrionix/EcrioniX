<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five step waveform debug loop">
<defs><marker id="m105-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
<text x="350" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="Outfit,sans-serif">Repeat until root cause confirmed</text>
<rect x="20" y="70" width="110" height="50" rx="8" fill="rgba(248,113,113,.12)" stroke="#f87171"/><text x="75" y="92" fill="#f87171" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">1. First fail</text><text x="75" y="108" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">read message</text>
<rect x="150" y="70" width="110" height="50" rx="8" fill="rgba(251,191,36,.12)" stroke="#fbbf24"/><text x="205" y="92" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">2. Hypothesize</text><text x="205" y="108" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">form theory</text>
<rect x="280" y="70" width="110" height="50" rx="8" fill="rgba(56,189,248,.12)" stroke="#38bdf8"/><text x="335" y="92" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">3. Pick signals</text><text x="335" y="108" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">5–10 max</text>
<rect x="410" y="70" width="110" height="50" rx="8" fill="rgba(167,139,250,.12)" stroke="#a78bfa"/><text x="465" y="92" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">4. Inspect waves</text><text x="465" y="108" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">confirm/deny</text>
<rect x="540" y="70" width="110" height="50" rx="8" fill="rgba(45,212,191,.12)" stroke="#2dd4bf"/><text x="595" y="92" fill="#2dd4bf" font-size="9" text-anchor="middle" font-family="Outfit,sans-serif">5. Root cause</text><text x="595" y="108" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">fix + re-run</text>
<line x1="130" y1="95" x2="150" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m105-arr)"/>
<line x1="260" y1="95" x2="280" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m105-arr)"/>
<line x1="390" y1="95" x2="410" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m105-arr)"/>
<line x1="520" y1="95" x2="540" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m105-arr)"/>
<path d="M595,120 Q595,160 75,160 Q20,160 20,120" fill="none" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m105-arr)"/>
<text x="350" y="175" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="Outfit,sans-serif">If hypothesis wrong → new hypothesis (don't add 50 more signals)</text>
</svg>