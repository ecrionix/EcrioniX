<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clock skew between launch and capture">
          <text x="120" y="35" fill="#38bdf8" font-size="12" font-family="Outfit,sans-serif">clk at launch FF</text>
          <path d="M40 50 H200 V25 H360 V50 H520" fill="none" stroke="#38bdf8" stroke-width="2"/>
          <text x="120" y="75" fill="#fbbf24" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">posedge here</text>
          <text x="420" y="35" fill="#a78bfa" font-size="12" font-family="Outfit,sans-serif">clk at capture FF (delayed)</text>
          <path d="M40 110 H240 V85 H400 V110 H520" fill="none" stroke="#a78bfa" stroke-width="2"/>
          <text x="400" y="135" fill="#fbbf24" font-size="11" text-anchor="middle" font-family="Outfit,sans-serif">posedge later → skew Δ</text>
          <line x1="360" y1="50" x2="400" y2="110" stroke="#f87171" stroke-dasharray="4 3"/>
          <text x="380" y="95" fill="#f87171" font-size="11" font-family="Outfit,sans-serif">Δ skew</text>
          <path d="M40 165 H520" stroke="#2dd4bf" stroke-width="2"/>
          <text x="40" y="195" fill="#2dd4bf" font-size="11" font-family="Outfit,sans-serif">data must stay stable through capture edge + hold</text>
          <text x="520" y="195" fill="#94a3b8" font-size="11" text-anchor="end" font-family="Outfit,sans-serif">PD adds skew buffers to fix hold</text>
        </svg>